    @media (prefers-color-scheme: dark) {

        --noir: #000000;

    * { box-sizing: border-box; }
    body {

    // Adresse d'Apps Script (lecture / écriture de la Sheet), utilisée quand la page est
    // hébergée ailleurs que chez Google (GitHub Pages) : aucun compte Google n'entre en jeu,
    // donc plus d'erreur « Impossible d'ouvrir le fichier » avec plusieurs comptes connectés.
    var URL_API = 'https://script.google.com/macros/s/AKfycbw6zkDi717zVCuxSCE4YUY7KYUMTSJroeg_sjgdOOa3m1MFUf7jbcJBKdRbhFOrDKZd5g/exec';
    var FONCTIONS_SERVEUR = ['getDonnees', 'repondre', 'inscrire', 'demanderLienCapitaine', 'infoCapitaine', 'deconnecterCapitaine',
      'getDonneesCapitaines', 'enregistrerRencontre', 'supprimerRencontre', 'renommerJoueur', 'supprimerJoueur',
      'validerCodeCapitaine', 'definirSelection', 'definirCodePerso', 'connexionCodePerso', 'definirClassement', 'importerJoueurs', 'definirFige',
      'enregistrerResultat'];
    var surAppsScript = !!(window.google && google.script && google.script.run);
    var CODE_PAGE = document.currentScript ? document.currentScript.textContent : '';

    /** Même usage que google.script.run : serveur().withSuccessHandler(…).withFailureHandler(…).fonction(args). */
    function serveur() {
      if (surAppsScript) return google.script.run;
      var h = { ok: function () {}, ko: function () {} };
      var appel = {
        withSuccessHandler: function (f) { h.ok = f; return appel; },
        withFailureHandler: function (f) { h.ko = f; return appel; },
      };
      FONCTIONS_SERVEUR.forEach(function (nom) {
        appel[nom] = function () {
          var args = Array.prototype.slice.call(arguments);
          // Corps en texte brut : pas de requête préalable CORS, Apps Script répond avec Access-Control-Allow-Origin: *.
          fetch(URL_API, { method: 'POST', body: JSON.stringify({ fn: nom, args: args }) })
            .then(function (r) { return r.json(); })
            .then(function (d) { if (d.ok) h.ok(d.result); else h.ko(new Error(d.error)); })
            .catch(function () { h.ko(new Error('problème de connexion')); });
        };
      });
      return appel;
    }

    // Lieu des matchs à domicile dans l'agenda (mettre l'adresse complète pour le GPS).
    var ADRESSE_CLUB = 'TC Bazogeais';

    var CLE_NOM = 'tcb-championnat-nom';
    var donnees = null;
    var enCours = {}; // rencontres dont la réponse part au serveur
    var choixMoi = '';         // nom touché dans « Qui es-tu ? », en attente de confirmation
    var importPlan = null;     // import de la liste FFT en cours (voir ecranImport)

    // --- Mémoire du téléphone (peut être indisponible en navigation privée) ---
    function lireNom() { try { return localStorage.getItem(CLE_NOM); } catch (e) { return null; } }
    function ecrireNom(nom) {
      try { nom ? localStorage.setItem(CLE_NOM, nom) : localStorage.removeItem(CLE_NOM); } catch (e) {}
    }
    var moi = lireNom();

    var CLE_CAPITAINE = 'tcb-championnat-capitaine';
    function lireJeton() { try { return localStorage.getItem(CLE_CAPITAINE) || ''; } catch (e) { return ''; } }
    function ecrireJeton(j) {
      try { j ? localStorage.setItem(CLE_CAPITAINE, j) : localStorage.removeItem(CLE_CAPITAINE); } catch (e) {}
    }
    // Lien de connexion reçu par mail : ?capitaine=<jeton>
    // Sur Apps Script, le serveur l'écrit ci-dessous ; sur GitHub Pages, il est lu dans l'adresse.
    var jetonDuLien = '<?= jetonCapitaine ?>';
    if (!/^[0-9a-f-]{36}$/.test(jetonDuLien)) {
      var m = /[?&]capitaine=([0-9a-f-]{36})/.exec(location.search);
      jetonDuLien = m ? m[1] : '';
    }
    if (jetonDuLien) {
      ecrireJeton(jetonDuLien);
      // Retire ?capitaine=… de la barre d'adresse : l'adresse copiée pour WhatsApp ne doit pas donner l'accès capitaine.
      try {
        if (surAppsScript) google.script.history.replace(null, {}, '');
        else history.replaceState(null, '', location.pathname);
      } catch (e) {}
    }
    var jeton = jetonDuLien || lireJeton();
    var capitaine = null;      // adresse du capitaine connecté
    var donneesCap = null;     // rencontres vues par les capitaines (avec nb de réponses)
    var edition = null;        // rencontre en cours de modification (null = création)
    var brouillon = null;      // valeurs du formulaire de rencontre
    var messageCap = '';
    var renommage = null;      // joueur en cours de renommage
    var capEmail = '';         // adresse saisie à la connexion capitaine
    var codeEnvoye = false;    // le mail avec le code est parti : afficher la saisie du code
    var modeMail = false;      // connexion par code reçu par mail (1re fois ou code capitaine oublié)
    var selId = '';            // rencontre ouverte dans l'écran Sélection (ou Résultat, côté capitaines)
    var selEnCours = 0;        // enregistrements de sélection en attente de réponse
    var invitationInstall = null; // évènement beforeinstallprompt (Android / ordinateur)
    var CLE_FILTRE_EQUIPE = 'tcb-championnat-equipe';
    var filtreEquipe = (function () { try { return localStorage.getItem(CLE_FILTRE_EQUIPE) || ''; } catch (e) { return ''; } })();
    var filtreJour = '';       // journée affichée dans le tableau des dispos ('' = toutes)
    var filtreReponse = '';    // '' | 'Présent' | 'Absent' | 'aucune' : joueurs ayant au moins une case de ce type
    // 'accueil' (choix dispos / résultats) | 'matchs' | 'resultats' | 'cap' (accueil capitaines) | 'cap-form' | 'cap-gerer' | …
    // La page s'ouvre toujours sur l'accueil des joueurs ; le lien reçu par mail connecte seulement le capitaine.
    var VUES_JOUEURS = ['accueil', 'matchs', 'resultats'];
    var vue = 'accueil';

    // --- Outils ---
    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function dateLongue(iso) {
      var p = iso.split('-');
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      var texte = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      return texte.charAt(0).toUpperCase() + texte.slice(1);
    }
    function dateDansPhrase(iso) { return dateLongue(iso).toLowerCase(); }
    function compte(n, singulier, pluriel) {
      return n + ' ' + (n > 1 ? pluriel : singulier);
    }
    function joueur(nom) {
      return donnees.joueurs.filter(function (j) { return j.nom === nom; })[0];
    }
    /** Équipe où le joueur est figé ('' = libre, il peut jouer dans toutes). */
    function figeEn(j) {
      var siennes = donnees.equipes.filter(function (e) { return j.equipes.indexOf(e) !== -1; });
      return donnees.equipes.length > 1 && siennes.length === 1 ? siennes[0] : '';
    }
    function joueursEquipe(equipe) {
      return donnees.joueurs.filter(function (j) { return j.equipes.indexOf(equipe) !== -1; });
    }
    function reponseDe(id, nom) {
      return (donnees.reponses[id] || {})[nom] || '';
    }
    function bilan(r) {
      var presents = [], absents = [], sansReponse = [];
      joueursEquipe(r.equipe).forEach(function (j) {
        var rep = reponseDe(r.id, j.nom);
        (rep === 'Présent' ? presents : rep === 'Absent' ? absents : sansReponse).push(j.nom);
      });
      return { presents: presents, absents: absents, sansReponse: sansReponse };
    }
    /** Bandeau vert temporaire (même emplacement que les erreurs). */
    function afficherInfo(message) {
      afficherErreur(message);
      var el = document.getElementById('erreur');
      el.style.background = 'var(--vert)';
      clearTimeout(afficherInfo.t);
      afficherInfo.t = setTimeout(function () { el.style.background = ''; }, message.length > 120 ? 12000 : 5000);
    }
    function afficherErreur(message) {
      document.getElementById('erreur').style.background = '';
      var el = document.getElementById('erreur');
      el.textContent = message;
      el.hidden = false;
      clearTimeout(afficherErreur.t);
      afficherErreur.t = setTimeout(function () { el.hidden = true; }, message.length > 120 ? 12000 : 5000);
    }
    /** Classe de couleur de l'équipe : e1, e2… (position dans la liste des équipes). */
    function classeEquipe(equipe) {
      var i = donnees.equipes.indexOf(equipe);
      return i === -1 ? '' : 'e' + (i + 1);
    }
    function pastilleEquipe(equipe) {
      return '<span class="equipe ' + classeEquipe(equipe) + '">' + esc(equipe) + '</span>';
    }
    function titreMatch(r) {
      return pastilleEquipe(r.equipe) + esc(r.adversaire || 'Adversaire à venir');
    }

    function badgeStatut(r) {
      return r.statut === 'Validée'
        ? '<span class="badge validee">✅ Date validée</span>'
        : '<span class="badge attente">⏳ En attente de convocation</span>';
    }
    function badgeTerrains(r) {
      return r.terrains ? '<span class="badge">🎾 ' + r.terrains + ' terrain' + (r.terrains === '2' ? 's' : '') + '</span>' : '';
    }
    /** Nombre de terrains, bien visible (vert : 2, orange : 1). */
    function messageTerrains(r) {
      if (r.terrains === '2') return '<div class="terrains terrains-2">🎾 <b>2 terrains</b></div>';
      if (r.terrains === '1') return '<div class="terrains terrains-1">🎾 <b>1 terrain</b></div>';
      return '';
    }
    function badgeLieu(r) {
      var texte = r.lieu === 'Domicile' ? '🏠 Domicile' : r.lieu === 'Extérieur' ? '🚗 Extérieur' : '📍 Lieu à venir';
      return '<span class="badge">' + texte + '</span>';
    }

    // --- Écrans ---
    function rendre() {
      var contenu = document.getElementById('contenu');
      var zoneMoi = document.getElementById('moi');

      if (!donnees) return;
      // Capitaine connecté : 👤 (ses propres dispos) et ⚙️ (espace capitaines) toujours en haut à droite.
      var boutonJoueur = document.getElementById('bouton-joueur'), boutonCap = document.getElementById('bouton-cap');
      boutonJoueur.hidden = boutonCap.hidden = !capitaine;
      document.querySelector('header').classList.toggle('cap-connecte', !!capitaine);
      boutonJoueur.classList.toggle('actif', VUES_JOUEURS.indexOf(vue) !== -1);
      boutonCap.classList.toggle('actif', vue.indexOf('cap') === 0);
      if (vue === 'cap-form') lireBrouillon();

      if (vue === 'installer') {
        zoneMoi.hidden = true;
        contenu.innerHTML = ecranInstaller();
        return;
      }
      if (VUES_JOUEURS.indexOf(vue) === -1) {
        zoneMoi.hidden = true;
        var defile = contenu.querySelector('.defile'), gauche = defile ? defile.scrollLeft : 0;
        contenu.innerHTML = ecranCapitaine();
        defile = contenu.querySelector('.defile');
        if (defile && gauche) defile.scrollLeft = gauche;
        return;
      }

      if (!moi || !joueur(moi)) {
        moi = null;
        zoneMoi.hidden = true;
        contenu.innerHTML = ecranQui();
        return;
      }

      zoneMoi.hidden = false;
      zoneMoi.innerHTML = esc(moi) + ' · <button id="changer">changer</button>';
      contenu.innerHTML = vue === 'matchs' ? ecranListe() : vue === 'resultats' ? ecranResultats() : ecranAccueil();
    }

    /** Même clé que côté serveur : sans accents, majuscules, points ni espaces. */
    function cleNom(texte) {
      return String(texte).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');
    }
    /** « julien  c » → « Julien C » (même règle que côté serveur). */
    function nettoyerNom(texte) {
      return String(texte || '').trim().replace(/\s+/g, ' ').toLowerCase()
        .replace(/(^|[\s'-])(\p{L})/gu, function (m, sep, lettre) { return sep + lettre.toUpperCase(); });
    }
    function joueurParSaisie(texte) {
      var cle = cleNom(texte);
      return donnees.joueurs.filter(function (j) { return cleNom(j.nom) === cle; })[0];
    }

    function ecranQui() {
      var html = '<div class="qui"><h2>Qui es-tu ?</h2>';
      if (choixMoi && joueur(choixMoi)) {
        return html + '<div class="carte confirmer"><p>Tu es bien</p><p class="nom-choisi">' + esc(choixMoi) + '</p>' +
          '<button class="gros" id="confirmer-moi">Oui, c\'est moi</button>' +
          '<button class="gros second" id="pas-moi">Non, revenir à la liste</button></div></div>';
      }
      if (!donnees.joueurs.length) {
        return html + '<p>La liste des joueurs est encore vide : un capitaine doit l\'importer.</p></div>' + piedCapitaines();
      }
      var tries = donnees.joueurs.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });
      return html + '<p>Touche ton nom. La première fois seulement : ton téléphone s\'en souviendra.</p>' +
        '<div class="noms">' + tries.map(function (j) {
          return '<button data-moi="' + esc(j.nom) + '">' + esc(j.nom) + '</button>';
        }).join('') + '</div>' +
        '<p class="sous" style="margin-top:14px">Tu n\'es pas dans la liste ? Demande à un capitaine de t\'ajouter.</p></div>' + piedCapitaines();
    }

    function piedCapitaines() {
      return (appliInstallee() ? '' : '<p class="pied"><button id="installer">📲 Installer l\'appli sur mon téléphone</button></p>') +
        '<p class="pied"><button data-vue="cap">⚙️ Espace capitaines</button></p>';
    }

    // ======================= Appli sur l'écran d'accueil =======================

    function appliInstallee() {
      return surAppsScript || window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    }
    function surIphone() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
    /** Nom du navigateur Android utilisé, pour les instructions. */
    function navigateur() {
      var ua = navigator.userAgent;
      if (navigator.brave) return 'Brave';
      if (/SamsungBrowser/i.test(ua)) return 'Samsung Internet';
      if (/MiuiBrowser|XiaoMi/i.test(ua)) return 'Mi Navigateur';
      if (/Firefox/i.test(ua)) return 'Firefox';
      if (/EdgA/i.test(ua)) return 'Edge';
      if (/OPR|Opera/i.test(ua)) return 'Opera';
      return 'Chrome';
    }

    function installer() { allerA('installer'); }

    function installerMaintenant() {
      if (!invitationInstall) return;
      invitationInstall.prompt();
      invitationInstall.userChoice.then(function () { invitationInstall = null; rendre(); });
    }

    function ecranInstaller() {
      var iphone = surIphone(), nav = navigateur();
      return '<div class="cap"><button class="retour" data-vue="accueil">← Accueil</button>' +
        '<h2>📲 Installer l\'appli</h2><p class="sous">L\'icône du club apparaîtra sur ton téléphone, comme une vraie appli.</p>' +
        (invitationInstall ? '<button class="gros" id="installer-direct" style="margin:0 0 16px">📲 Installer maintenant</button>' +
          '<p class="sous">Si rien ne se passe ou si l\'icône n\'apparaît pas, suis les étapes ci-dessous.</p>' : '') +
        '<div class="carte"><ol class="etapes">' + (iphone
          ? '<li>Ouvre cette page dans <b>Safari</b> (pas depuis WhatsApp ou Gmail : touche « Ouvrir dans Safari » si besoin).</li>' +
            '<li>Touche le bouton <b>Partager</b> ⬆️ en bas de l\'écran.</li>' +
            '<li>Fais défiler et choisis <b>« Sur l\'écran d\'accueil »</b>, puis <b>Ajouter</b>.</li>'
          : '<li>Ouvre cette page dans <b>' + nav + '</b> (depuis WhatsApp : menu ⋮ → « Ouvrir dans le navigateur »).</li>' +
            '<li>Touche le menu <b>⋮</b> en haut à droite.</li>' +
            '<li>Choisis <b>« Ajouter à l\'écran d\'accueil »</b> ou <b>« Installer l\'appli »</b>, puis <b>Installer</b>.</li>') +
          '' +
        '<li>Ouvre l\'appli depuis l\'icône : tape ton prénom une fois, c\'est tout.</li></ol></div>' +
        (iphone ? '' : '<div class="carte"><b>📱 Xiaomi, Redmi, Poco, Huawei, Oppo : l\'icône n\'apparaît pas ?</b>' +
          '<ol class="etapes" style="margin-top:8px">' +
          '<li>Appui long sur l\'icône <b>' + nav + '</b> → <b>ⓘ Infos sur l\'application</b>.</li>' +
          '<li><b>Autres autorisations</b> → <b>Raccourcis sur l\'écran d\'accueil</b> → <b>Accepter</b>.</li>' +
          '<li>Reviens ici et recommence l\'installation (menu ⋮ → Ajouter à l\'écran d\'accueil).</li></ol></div>') +
        '<p class="sous">Capitaine ? Dans l\'appli, ⚙️ Espace capitaines → ton adresse → ton <b>code capitaine</b> (la 1re fois : code reçu par mail).</p></div>';
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      invitationInstall = e;
    });
    window.addEventListener('appinstalled', function () {
      invitationInstall = null;
      afficherInfo('Appli installée ✅ Cherche « TCB Champ. » dans la liste de tes applis (glisse vers le haut). ' +
        'Pas d\'icône (Xiaomi…) ? Bouton 📲 Installer l\'appli en bas de la page pour le réglage à faire.');
      setTimeout(rendre, 500);
    });
    if (!surAppsScript && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }

    /** Après le choix du nom : donner ses dispos ou voir les résultats. */
    function ecranAccueil() {
      var aVenir = donnees.rencontres.filter(function (r) { return !reponseDe(r.id, moi) && joueur(moi).equipes.indexOf(r.equipe) !== -1; }).length;
      var dernier = (donnees.resultats || [])[0];
      return '<div class="accueil"><h2>Salut ' + esc(moi.split(' ')[0]) + ' 👋</h2><p class="sous">Que veux-tu faire ?</p>' +
        '<div class="tuiles une">' +
          tuile('matchs', '📅', 'Mes disponibilités', aVenir ? compte(aVenir, 'match', 'matchs') + ' sans réponse de ta part' : 'Matchs à venir, je suis dispo / pas dispo') +
          tuile('resultats', '🏆', 'Résultats championnat', dernier
            ? 'Dernier : ' + dernier.equipe + ' – ' + dernier.adversaire + ' (' + scoreTexte(dernier) + ')'
            : 'Scores des rencontres et des parties') +
        '</div></div>' + piedCapitaines();
    }

    function boutonAccueil() { return '<button class="retour" data-vue="accueil">← Accueil</button>'; }

    // ======================= Résultats =======================

    /** « 6-3 4-6 7-6(5) » (vu du TCB) → [{ nous: 6, eux: 3, tb: '' }, …] ; [] si le score ne se lit pas. */
    function setsDe(score) {
      var sets = [];
      var ok = String(score || '').trim().split(/\s+/).every(function (x) {
        var m = /^(\d{1,2})[-\/](\d{1,2})(?:\((\d{1,2})\))?$/.exec(x);
        if (m) sets.push({ nous: +m[1], eux: +m[2], tb: m[3] || '' });
        return !!m;
      });
      return ok ? sets : [];
    }
    /** 'Gagné' | 'Perdu' | '' : résultat saisi, sinon déduit du score (sets gagnés). */
    function issuePartie(p) {
      if (p.resultat) return p.resultat;
      var g = 0, d = 0;
      setsDe(p.score).forEach(function (s) { if (s.nous > s.eux) g++; else if (s.eux > s.nous) d++; });
      return g > d ? 'Gagné' : d > g ? 'Perdu' : '';
    }
    function pointsRencontre(res) {
      var nous = 0, eux = 0;
      res.parties.forEach(function (p) { var i = issuePartie(p); if (i === 'Gagné') nous++; else if (i === 'Perdu') eux++; });
      return { nous: nous, eux: eux };
    }
    function scoreTexte(res) { var pts = pointsRencontre(res); return pts.nous + '-' + pts.eux; }

    function ecranResultats() {
      if (donnees.equipes.indexOf(filtreEquipe) === -1) filtreEquipe = '';
      var html = '<div class="cap">' + boutonAccueil() + '<h2>🏆 Résultats championnat</h2></div>';
      var filtres = '<div class="filtres"><button data-filtre-equipe=""' + (filtreEquipe ? '' : ' class="choisi"') + '>Toutes</button>' +
        donnees.equipes.map(function (e) {
          return '<button data-filtre-equipe="' + esc(e) + '"' + (e === filtreEquipe ? ' class="choisi"' : '') + '>' + pastilleEquipe(e) + '</button>';
        }).join('') + '</div>';
      var liste = (donnees.resultats || []).filter(function (r) { return !filtreEquipe || r.equipe === filtreEquipe; });
      if (!liste.length) return html + filtres + '<div class="vide">Aucun résultat pour l\'instant.</div>';
      // Bilan du joueur sur les rencontres affichées.
      var v = 0, d = 0;
      liste.forEach(function (r) {
        r.parties.forEach(function (p) {
          if (p.nous.indexOf(moi) === -1) return;
          var i = issuePartie(p);
          if (i === 'Gagné') v++; else if (i === 'Perdu') d++;
        });
      });
      var bilanMoi = v + d ? '<div class="bilan-moi">🎾 Ton bilan : <b>' + compte(v, 'victoire', 'victoires') + '</b> · ' + compte(d, 'défaite', 'défaites') + '</div>' : '';
      return html + filtres + bilanMoi + liste.map(carteResultat).join('');
    }

    function carteResultat(res) {
      var pts = pointsRencontre(res);
      var verdict = pts.nous > pts.eux ? '<span class="verdict victoire">✅ Victoire</span>'
        : pts.nous < pts.eux ? '<span class="verdict defaite">❌ Défaite</span>' : '<span class="verdict nul">➖ Égalité</span>';
      return '<div class="carte rencontre ' + classeEquipe(res.equipe) + '" style="margin-left:0">' +
        '<div class="ligne-info">' + esc(dateLongue(res.date)) + (res.lieu ? ' · ' + (res.lieu === 'Domicile' ? '🏠 Domicile' : '🚗 Extérieur') : '') + '</div>' +
        '<div class="score-renc">' +
          '<span class="club">' + pastilleEquipe(res.equipe) + 'TC Bazoges</span><span class="pts' + (pts.nous > pts.eux ? ' gagne' : '') + '">' + pts.nous + '</span>' +
          '<span class="club">' + esc(res.adversaire) + '</span><span class="pts' + (pts.eux > pts.nous ? ' gagne' : '') + '">' + pts.eux + '</span>' +
        '</div>' + verdict +
        '<details' + (res.parties.some(function (p) { return p.nous.indexOf(moi) !== -1; }) ? ' open' : '') + '><summary>Détail des ' + res.parties.length + ' parties</summary>' +
          res.parties.map(blocPartie).join('') +
        '</details></div>';
    }

    function blocPartie(p) {
      var issue = issuePartie(p), sets = setsDe(p.score);
      var camp = function (noms, clts, club, eux) {
        var gagnant = issue === (eux ? 'Perdu' : 'Gagné');
        return '<div class="camp' + (gagnant ? ' gagnant' : '') + (eux ? ' eux' : '') + '"><div class="joueurs-camp">' +
          (noms.length ? noms : ['?']).map(function (n, i) {
            return '<div' + (!eux && n === moi ? ' class="moi-res"' : '') + '>' + esc(n) + (clts[i] ? '<span class="clt">' + esc(clts[i]) + '</span>' : '') + '</div>';
          }).join('') + '<small>' + esc(club) + '</small></div>' +
          '<div class="sets">' + (sets.length ? sets.map(function (s) {
            var a = eux ? s.eux : s.nous, b = eux ? s.nous : s.eux;
            // Points du jeu décisif : du côté de celui qui perd le set (comme sur Ten'Up).
            return '<span' + (a > b ? ' class="pris"' : '') + '>' + a + (s.tb && a < b ? '<sup>' + esc(s.tb) + '</sup>' : '') + '</span>';
          }).join('') : (eux ? '' : '<span>' + esc(p.score) + '</span>')) + '</div></div>';
      };
      return '<div class="partie"><div class="partie-titre">🎾 ' + esc(p.partie) + '</div>' +
        camp(p.nous, p.cltNous, 'TC Bazoges', false) + camp(p.eux, p.cltEux, '', true) + '</div>';
    }

    /** Tous les matchs du club, par date ; chacun peut répondre sur chaque match. */
    function ecranListe() {
      var pied = piedCapitaines();
      if (!donnees.rencontres.length) return boutonAccueil() + '<div class="vide">Aucune rencontre à venir.</div>' + pied;
      if (donnees.equipes.indexOf(filtreEquipe) === -1) filtreEquipe = '';
      var filtres = boutonAccueil() + '<div class="filtres"><button data-filtre-equipe=""' + (filtreEquipe ? '' : ' class="choisi"') + '>Toutes</button>' +
        donnees.equipes.map(function (e) {
          return '<button data-filtre-equipe="' + esc(e) + '"' + (e === filtreEquipe ? ' class="choisi"' : '') + '>' + pastilleEquipe(e) + '</button>';
        }).join('') + '</div>';
      var rs = donnees.rencontres.filter(function (r) { return !filtreEquipe || r.equipe === filtreEquipe; });
      if (!rs.length) return filtres + '<div class="vide">Aucune rencontre à venir pour ' + esc(filtreEquipe) + '.</div>' + pied;
      return filtres + parJour(rs).map(function (j) {
        // L'alerte terrains compte toutes les rencontres du jour, même filtrées.
        var domicile = donnees.rencontres.filter(function (r) { return r.date === j.date && r.lieu === 'Domicile'; }).length;
        var html = '<div class="carte"><p class="jour">' + esc(dateLongue(j.date)) + '</p>';
        if (domicile > donnees.maxDomicileParJour) {
          html += '<div class="alerte">⚠️ ' + domicile + ' rencontres à domicile ce jour-là, pour ' +
            donnees.nbTerrains + ' terrains.</div>';
        }
        return html + j.rencontres.map(carteRencontre).join('') + '</div>';
      }).join('') + pied;
    }

    function parJour(rencontres) {
      var jours = [], index = {};
      rencontres.forEach(function (r) {
        if (!(r.date in index)) { index[r.date] = jours.length; jours.push({ date: r.date, rencontres: [] }); }
        jours[index[r.date]].rencontres.push(r);
      });
      return jours;
    }

    function carteRencontre(r) {
      var rep = reponseDe(r.id, moi);
      var b = bilan(r);
      var occupe = enCours[r.id] ? ' disabled' : '';
      var moiJoueur = joueur(moi), fige = moiJoueur && moiJoueur.equipes.indexOf(r.equipe) === -1 ? figeEn(moiJoueur) : '';
      return '<div class="rencontre ' + classeEquipe(r.equipe) + '">' +
        '<div class="match">' + titreMatch(r) + '</div>' +
        '<div class="ligne-info">' + esc(r.heure || 'Heure à venir') + '</div>' +
        '<div class="badges">' + badgeStatut(r) + badgeLieu(r) + '</div>' +
        messageTerrains(r) +
        (r.infos ? '<div class="infos">' + esc(r.infos) + '</div>' : '') +
        blocComposition(r) +
        (fige
          ? '<div class="fige">🔒 Tu es figé en ' + esc(fige) + ' : pas de dispo à donner pour ce match.</div>'
          : '<div class="boutons">' +
              '<button class="oui' + (rep === 'Présent' ? ' choisi' : '') + '" data-id="' + esc(r.id) + '" data-rep="Présent"' + occupe + '>' +
                (rep === 'Présent' ? '✅ ' : '') + 'Je suis dispo</button>' +
              '<button class="non' + (rep === 'Absent' ? ' choisi' : '') + '" data-id="' + esc(r.id) + '" data-rep="Absent"' + occupe + '>' +
                (rep === 'Absent' ? '❌ ' : '') + 'Pas dispo</button>' +
            '</div>' +
            (rep ? '<div class="aide">Touche à nouveau pour annuler ta réponse.</div>' : '')) +
        '<details><summary>' + compte(b.presents.length, 'dispo', 'dispos') + ' · ' +
          compte(b.absents.length, 'pas dispo', 'pas dispos') + ' · ' + b.sansReponse.length + ' sans réponse</summary><div class="liste">' +
          ligneNoms('✅ Dispos', b.presents) +
          ligneNoms('❌ Pas dispos', b.absents) +
          ligneNoms('… Pas répondu', b.sansReponse) +
        '</div></details>' +
        '</div>';
    }

    function blocComposition(r) {
      var t = ordreDeJeu(r.id), rp = nomsRole(r.id, 'Remplaçant');
      if (!t.length && !rp.length) return '';
      var monRole = selectionDe(r.id)[moi];
      var badge = !monRole ? '' : monRole === 'Remplaçant' ? '🔄 Tu es remplaçant' :
        /^N°\d$/.test(monRole) ? '🏆 Tu joues en n°' + monRole.slice(2) : '🏆 Tu es retenu dans l\'équipe';
      return (badge ? '<div class="retenu">' + badge + '</div>' + boutonAgenda(r, monRole) : '') +
        '<div class="compo"><b>🏆 Ordre de jeu (simples) :</b>' + (t.length ? '<ol class="ordre">' + t.map(function (x) {
          return '<li' + (x.nom === moi ? ' class="moi-compo"' : '') + '><span>' + esc(x.n ? 'n°' + x.n : '•') + '</span> ' + esc(x.nom) + '</li>';
        }).join('') + '</ol>' : ' à venir') +
        (rp.length ? '<b>🔄 Remplaçant' + (rp.length > 1 ? 's' : '') + ' :</b> ' + esc(rp.join(', ')) : '') + '</div>';
    }

    // ======================= Agenda =======================

    function deuxChiffres(n) { return (n < 10 ? '0' : '') + n; }
    /** Début / fin de l'évènement : à l'heure du match pour 4 h, sinon journée entière. */
    function horairesMatch(r) {
      var p = r.date.split('-'), m = /^(\d{2}):(\d{2})$/.exec(r.heure || '');
      var jour = p[0] + p[1] + p[2];
      if (!m) {
        var lendemain = new Date(+p[0], +p[1] - 1, +p[2] + 1);
        return { journee: true, debut: jour, fin: lendemain.getFullYear() + deuxChiffres(lendemain.getMonth() + 1) + deuxChiffres(lendemain.getDate()) };
      }
      var fin = new Date(+p[0], +p[1] - 1, +p[2], +m[1] + 4, +m[2]);
      return {
        journee: false,
        debut: jour + 'T' + m[1] + m[2] + '00',
        fin: fin.getFullYear() + deuxChiffres(fin.getMonth() + 1) + deuxChiffres(fin.getDate()) + 'T' + deuxChiffres(fin.getHours()) + deuxChiffres(fin.getMinutes()) + '00',
      };
    }
    function infosAgenda(r, role) {
      var place = role === 'Remplaçant' ? 'remplaçant' : /^N°\d$/.test(role) ? 'n°' + role.slice(2) : '';
      return {
        titre: '🎾 ' + r.equipe + ' – ' + (r.adversaire || 'adversaire à venir') + (place ? ' (' + place + ')' : ''),
        lieu: r.lieu === 'Domicile' ? ADRESSE_CLUB : r.lieu === 'Extérieur' ? (r.adversaire || '') : '',
        details: (r.infos ? r.infos + '\n' : '') + 'Portail championnat : ' + (surAppsScript ? URL_API : location.origin + location.pathname),
      };
    }
    function lienGoogleAgenda(r, role) {
      var h = horairesMatch(r), i = infosAgenda(r, role);
      return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
        '&text=' + encodeURIComponent(i.titre) + '&dates=' + h.debut + '/' + h.fin + '&ctz=Europe/Paris' +
        '&location=' + encodeURIComponent(i.lieu) + '&details=' + encodeURIComponent(i.details);
    }
    /** Fichier .ics (iPhone : proposé directement à l'app Calendrier). */
    function fichierAgenda(r, role) {
      var h = horairesMatch(r), i = infosAgenda(r, role);
      var echap = function (t) { return String(t).replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); };
      var maintenant = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
      var lignes = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TC Bazogeais//Portail championnat//FR', 'BEGIN:VEVENT',
        'UID:' + r.id + '@tcbazogeais.github.io', 'DTSTAMP:' + maintenant,
        h.journee ? 'DTSTART;VALUE=DATE:' + h.debut : 'DTSTART;TZID=Europe/Paris:' + h.debut,
        h.journee ? 'DTEND;VALUE=DATE:' + h.fin : 'DTEND;TZID=Europe/Paris:' + h.fin,
        'SUMMARY:' + echap(i.titre), 'LOCATION:' + echap(i.lieu), 'DESCRIPTION:' + echap(i.details),
        'END:VEVENT', 'END:VCALENDAR'];
      return lignes.join('\r\n');
    }
    function boutonAgenda(r, role) {
      if (surIphone()) return '<button class="agenda" data-agenda="' + esc(r.id) + '">📅 Ajouter à mon agenda</button>';
      return '<a class="agenda" href="' + esc(lienGoogleAgenda(r, role)) + '" target="_blank" rel="noopener">📅 Ajouter à mon agenda</a>';
    }
    function telechargerAgenda(id) {
      var r = donnees.rencontres.filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      var lien = document.createElement('a');
      lien.href = URL.createObjectURL(new Blob([fichierAgenda(r, selectionDe(r.id)[moi])], { type: 'text/calendar' }));
      lien.download = 'match-' + r.date + '.ics';
      document.body.appendChild(lien);
      lien.click();
      setTimeout(function () { URL.revokeObjectURL(lien.href); document.body.removeChild(lien); }, 1000);
    }

    /** Joueurs retenus dans l'ordre de jeu : [{ n: 1, nom }, …] (ancien rôle « Titulaire » en fin, sans numéro). */
    function ordreDeJeu(id) {
      var sel = selectionDe(id);
      return Object.keys(sel)
        .filter(function (nom) { return sel[nom] !== 'Remplaçant'; })
        .map(function (nom) { var m = /^N°(\d)$/.exec(sel[nom]); return { n: m ? +m[1] : 0, nom: nom }; })
        .sort(function (a, b) { return (a.n || 99) - (b.n || 99) || a.nom.localeCompare(b.nom, 'fr'); });
    }

    function ligneNoms(titre, noms) {
      return '<div><b>' + titre + '</b> ' + (noms.length ? esc(noms.join(', ')) : '–') + '</div>';
    }

    function repondre(id, rep) {
      var ancienne = reponseDe(id, moi);
      var nouvelle = ancienne === rep ? '' : rep; // toucher à nouveau = annuler

      // Affichage immédiat, corrigé si le serveur refuse.
      donnees.reponses[id] = donnees.reponses[id] || {};
      if (nouvelle) donnees.reponses[id][moi] = nouvelle; else delete donnees.reponses[id][moi];
      enCours[id] = true;
      rendre();

      serveur()
        .withSuccessHandler(function (reponses) {
          delete enCours[id];
          donnees.reponses = reponses;
          rendre();
        })
        .withFailureHandler(function (err) {
          delete enCours[id];
          if (ancienne) donnees.reponses[id][moi] = ancienne; else delete donnees.reponses[id][moi];
          rendre();
          afficherErreur('Réponse non enregistrée : ' + (err && err.message ? err.message : 'problème de connexion') + '. Réessaie.');
        })
        .repondre([id], moi, nouvelle);
    }

    // ======================= Espace capitaines =======================

    /** Tableau des dispos : le capitaine change la réponse d'un joueur (– → ✅ → ❌ → –). */
    var repCapEnCours = {}; // id|nom → nb d'enregistrements en attente
    var lignesTableau = []; // joueurs affichés dans le tableau
    var lignesFigees = null; // lignes gardées telles quelles après un toucher (jusqu'au prochain filtre ou écran)
    function repondrePour(id, nom) {
      var ancienne = reponseDe(id, nom);
      var nouvelle = ancienne === '' ? 'Présent' : ancienne === 'Présent' ? 'Absent' : '';
      var cle = id + '|' + nom;
      if (!lignesFigees) lignesFigees = lignesTableau;
      donnees.reponses[id] = donnees.reponses[id] || {};
      if (nouvelle) donnees.reponses[id][nom] = nouvelle; else delete donnees.reponses[id][nom];
      repCapEnCours[cle] = (repCapEnCours[cle] || 0) + 1;
      rendre();
      serveur()
        .withSuccessHandler(function (reponses) {
          // Une réponse plus ancienne ne doit pas effacer un toucher fait entre-temps.
          if (--repCapEnCours[cle] === 0 && Object.keys(repCapEnCours).every(function (k) { return !repCapEnCours[k]; })) {
            donnees.reponses = reponses;
            if (vue === 'cap-tableau') rendre();
          }
        })
        .withFailureHandler(function (err) {
          repCapEnCours[cle]--;
          if (ancienne) donnees.reponses[id][nom] = ancienne; else delete donnees.reponses[id][nom];
          rendre();
          afficherErreur('Réponse de ' + nom + ' non enregistrée : ' + (err && err.message ? err.message : 'problème de connexion') + '. Réessaie.');
        })
        .repondre([id], nom, nouvelle);
    }

    function ecranCapitaine() {
      if (!capitaine) return jeton ? '<div class="vide">Connexion…</div>' : ecranConnexionCap();
      if (vue === 'cap-form') return ecranFormRencontre();
      if (vue === 'cap-gerer') return ecranGerer();
      if (vue === 'cap-dispos') return ecranDispos();
      if (vue === 'cap-tableau') return ecranTableau();
      if (vue === 'cap-selection') return selId ? ecranSelectionMatch() : ecranSelection();
      if (vue === 'cap-joueurs') return ecranJoueurs();
      if (vue === 'cap-code') return ecranCodePerso();
      if (vue === 'cap-classements') return ecranClassements();
      if (vue === 'cap-import') return ecranImport();
      if (vue === 'cap-resultats') return selId ? ecranFormResultat() : ecranResultatsCap();
      var nbAttente = donnees.rencontres.filter(function (r) { return r.statut !== 'Validée'; }).length;
      return '<div class="cap"><button class="retour" data-vue="accueil">← Page des joueurs</button><h2>⚙️ Espace capitaines</h2><p class="sous">Connecté : ' + esc(capitaine) + '</p>' +
        (messageCap ? '<div class="info">' + esc(messageCap) + '</div>' : '') +
        '<div class="tuiles">' +
          tuile('cap-form', '➕', 'Créer une rencontre', 'Date, adversaire, lieu…', true) +
          tuile('cap-gerer', '📅', 'Gérer les rencontres', 'Modifier, valider, supprimer' + (nbAttente ? ' · ' + nbAttente + ' en attente' : '')) +
          tuile('cap-selection', '🏆', 'Sélection', 'Composer les équipes, envoyer sur WhatsApp') +
          tuile('cap-tableau', '📊', 'Tableau des dispos', 'Vue globale joueurs × matchs') +
          tuile('cap-dispos', '👥', 'Dispos par match', 'Qui vient à chaque match') +
          tuile('cap-resultats', '📋', 'Résultats', resultatsASaisir() ? resultatsASaisir() + ' à saisir' : 'Score des rencontres jouées') +
          tuile('cap-classements', '🎾', 'Classements', classementsAVerifier() ? classementsAVerifier() + ' à vérifier' : 'Tous vérifiés ce mois-ci') +
          tuile('cap-joueurs', '👤', 'Joueurs', sansReponseTotal() ? sansReponseTotal() + ' sans réponse à tout' : 'Renommer, supprimer') +
          tuile('accueil', '🎾', 'Page des joueurs', 'Dispos et résultats') +
          (appliInstallee() ? '' : tuile('installer', '📲', 'Installer l\'appli', 'Icône sur ton téléphone')) +
        '</div>' +
        '<p class="pied"><button data-vue="cap-code">🔑 Choisir ou changer mon code capitaine</button></p>' +
        '<p class="pied"><button id="deconnexion-cap">Se déconnecter de l\'espace capitaines</button></p></div>';
    }

    // ======================= Saisie des résultats (capitaines) =======================

    function aujourdhui() {
      var d = new Date();
      return d.getFullYear() + '-' + deuxChiffres(d.getMonth() + 1) + '-' + deuxChiffres(d.getDate());
    }
    /** Rencontres déjà jouées (ou du jour), la plus récente en premier. */
    function rencontresJouees() {
      var jour = aujourdhui();
      return (donnees.calendrier || []).filter(function (r) { return r.date <= jour; })
        .sort(function (a, b) { return b.date.localeCompare(a.date) || a.equipe.localeCompare(b.equipe); });
    }
    function resultatDe(id) { return (donnees.resultats || []).filter(function (x) { return x.id === id; })[0]; }
    function resultatsASaisir() {
      return rencontresJouees().filter(function (r) { return !resultatDe(r.id); }).length;
    }

    function ecranResultatsCap() {
      var html = enTeteCap('📋 Résultats') +
        '<p class="sous">Touche une rencontre jouée pour saisir ou corriger son score (copie de la feuille de match Ten\'Up). Les joueurs le voient dans 🏆 Résultats championnat.</p>';
      var rs = rencontresJouees();
      if (!rs.length) return html + '<div class="vide">Aucune rencontre jouée pour l\'instant.</div></div>';
      return html + '<div class="carte">' + rs.map(function (r) {
        var res = resultatDe(r.id);
        return '<div class="rencontre ' + classeEquipe(r.equipe) + '"><div class="match">' + titreMatch(r) + '</div>' +
          '<div class="ligne-info">' + esc(dateLongue(r.date)) + ' · ' + (res ? '<b>' + scoreTexte(res) + '</b>' : '⏳ pas encore saisi') + '</div>' +
          '<div class="ligne-cap"><button data-res="' + esc(r.id) + '">' + (res ? '✏️ Modifier le résultat' : '➕ Saisir le résultat') + '</button></div></div>';
      }).join('') + '</div></div>';
    }

    function ecranFormResultat() {
      var r = (donnees.calendrier || []).filter(function (x) { return x.id === selId; })[0];
      if (!r) { selId = ''; return ecranResultatsCap(); }
      var res = resultatDe(r.id);
      var parties = {};
      (res ? res.parties : []).forEach(function (p) { parties[p.partie] = p; });
      var noms = donnees.joueurs.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); }).map(function (j) { return j.nom; });
      var choixJoueur = function (actuel, cle) {
        var liste = actuel && noms.indexOf(actuel) === -1 ? noms.concat([actuel]) : noms;
        return '<select data-res-joueur="' + cle + '"><option value="">– Joueur TCB –</option>' + liste.map(function (n) {
          return '<option' + (n === actuel ? ' selected' : '') + '>' + esc(n) + '</option>';
        }).join('') + '</select>';
      };
      var html = '<div class="cap"><button class="retour" data-vue="cap-resultats">← Résultats</button>' +
        '<h2>' + titreMatch(r) + '</h2><p class="sous">' + esc(dateLongue(r.date)) + '. Score vu du TCB, set par set : « 6-3 4-6 7-6(5) » ' +
        '(entre parenthèses : points du jeu décisif du perdant). Une partie laissée vide n\'est pas enregistrée.</p>' +
        '<form id="form-resultat" class="carte">';
      donnees.parties.forEach(function (nomPartie, i) {
        var p = parties[nomPartie] || { nous: [], cltNous: [], eux: [], cltEux: [], score: '', resultat: '' };
        var nb = /^Double/.test(nomPartie) ? 2 : 1, k;
        html += '<div class="form-partie" data-partie="' + esc(nomPartie) + '"><h3>🎾 ' + esc(nomPartie) + '</h3><div class="etiquette">TC Bazoges</div>';
        for (k = 0; k < nb; k++) {
          html += '<div class="joueur-clt">' + choixJoueur(p.nous[k] || '', i + '-' + k) +
            '<input data-clt-nous placeholder="Clt" maxlength="10" value="' + esc(p.cltNous[k] || '') + '" id="clt-' + i + '-' + k + '"></div>';
        }
        html += '<div class="etiquette">' + esc(r.adversaire || 'Adversaire') + '</div>';
        for (k = 0; k < nb; k++) {
          html += '<div class="joueur-clt"><input data-eux placeholder="Prénom Nom" maxlength="60" value="' + esc(p.eux[k] || '') + '">' +
            '<input data-clt-eux placeholder="Clt" maxlength="10" value="' + esc(p.cltEux[k] || '') + '"></div>';
        }
        html += '<div class="etiquette">Score et résultat</div><div class="ligne-score">' +
          '<input data-score placeholder="6-3 4-6 7-6(5)" maxlength="40" value="' + esc(p.score) + '">' +
          '<select data-resultat><option value="">Auto</option>' + ['Gagné', 'Perdu'].map(function (v) {
            return '<option' + (p.resultat === v ? ' selected' : '') + '>' + v + '</option>';
          }).join('') + '</select></div></div>';
      });
      html += '<button class="gros" type="submit">Enregistrer le résultat</button>' +
        (res ? '<button class="gros danger" type="button" id="effacer-resultat">Effacer ce résultat</button>' : '') + '</form></div>';
      return html;
    }

    /** Parties remplies du formulaire de résultat. */
    function lireFormResultat() {
      var parties = [];
      Array.prototype.forEach.call(document.querySelectorAll('#form-resultat .form-partie'), function (bloc) {
        var valeurs = function (sel) { return Array.prototype.map.call(bloc.querySelectorAll(sel), function (x) { return x.value.trim(); }); };
        var nous = valeurs('[data-res-joueur]'), cltNous = valeurs('[data-clt-nous]'), eux = valeurs('[data-eux]'), cltEux = valeurs('[data-clt-eux]');
        var score = bloc.querySelector('[data-score]').value.trim(), resultat = bloc.querySelector('[data-resultat]').value;
        if (!nous.some(String) && !eux.some(String) && !score) return;
        // Garde le classement en face du bon joueur, même si une ligne est vide.
        var garder = function (noms, clts) { return clts.filter(function (c, i) { return noms[i]; }); };
        parties.push({
          partie: bloc.getAttribute('data-partie'),
          nous: nous.filter(String), cltNous: garder(nous, cltNous),
          eux: eux.filter(String), cltEux: garder(eux, cltEux),
          score: score, resultat: resultat,
        });
      });
      return parties;
    }

    function enregistrerResultat(parties, message) {
      var id = selId;

    /** Rencontres à venir qui concernent un joueur (ses équipes). */
    function matchsDe(j) {
      return donnees.rencontres.filter(function (r) { return j.equipes.indexOf(r.equipe) !== -1; });
    }
    function nbReponsesDe(j) {
      return matchsDe(j).filter(function (r) { return reponseDe(r.id, j.nom); }).length;
    }
    /** Nombre de joueurs qui n'ont répondu à aucun de leurs matchs. */
    function sansReponseTotal() {
      return donnees.joueurs.filter(function (j) { return matchsDe(j).length && !nbReponsesDe(j); }).length;
    }
    function dateCourte(iso) {
      var p = iso.split('-');
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }).replace('.', '');
    }
    function abregeEquipe(e) { return e.replace('Hommes ', 'H'); }

    function ecranTableau() {
      var html = enTeteCap('Tableau des dispos');
      if (!donnees.rencontres.length || !donnees.joueurs.length) return html + '<div class="vide">Pas encore de rencontres ou de joueurs.</div></div>';
      var jours = parJour(donnees.rencontres).map(function (j) { return j.date; });
      if (jours.indexOf(filtreJour) === -1) filtreJour = '';
      html += '<div class="filtres"><button data-filtre-jour=""' + (filtreJour ? '' : ' class="choisi"') + '>Toutes</button>' +
        jours.map(function (d) {
          return '<button data-filtre-jour="' + d + '"' + (d === filtreJour ? ' class="choisi"' : '') + '>' + esc(dateCourte(d)) + '</button>';
        }).join('') + '</div>';
      var rs = donnees.rencontres.filter(function (r) { return !filtreJour || r.date === filtreJour; });
      // Sur une journée : dispos d'abord, puis sans réponse, puis pas dispos (pratique pour la sélection).
      var rang = function (j) {
        var reps = rs.filter(function (r) { return j.equipes.indexOf(r.equipe) !== -1; }).map(function (r) { return reponseDe(r.id, j.nom); });
        return reps.indexOf('Présent') !== -1 ? 0 : reps.indexOf('Absent') !== -1 && reps.every(Boolean) ? 2 : 1;
      };
      var joueurs = filtreJour
        ? donnees.joueurs.slice().sort(function (a, b) { return rang(a) - rang(b) || a.nom.localeCompare(b.nom, 'fr'); })
        : donnees.joueurs;

      // Filtre par réponse : garde les joueurs qui ont au moins une case de ce type parmi les matchs affichés.
      var aCase = function (j, type) {
        return rs.some(function (r) {
          if (j.equipes.indexOf(r.equipe) === -1) return false;
          var rep = reponseDe(r.id, j.nom);
          return type === 'aucune' ? !rep : rep === type;
        });
      };
      var types = [['', 'Tous'], ['Présent', '✅ Dispo'], ['Absent', '❌ Pas dispo'], ['aucune', '– Non voté']];
      html += '<div class="filtres retour">' + types.map(function (t) {
        var nb = t[0] ? joueurs.filter(function (j) { return aCase(j, t[0]); }).length : joueurs.length;
        return '<button data-filtre-reponse="' + t[0] + '"' + (t[0] === filtreReponse ? ' class="choisi"' : '') + '>' +
          t[1] + ' (' + nb + ')</button>';
      }).join('') + '</div>';
      if (filtreReponse) joueurs = joueurs.filter(function (j) { return aCase(j, filtreReponse); });
      // Pendant que le capitaine touche des cases, les lignes ne bougent pas (ni tri, ni filtre).
      if (lignesFigees) joueurs = lignesFigees.map(joueur).filter(Boolean);
      lignesTableau = joueurs.map(function (j) { return j.nom; });
      if (!joueurs.length) return html + '<div class="vide">Aucun joueur pour ce filtre.</div></div>';
      html += '<div class="defile"><table class="grille"><thead><tr><th class="nom">Joueur</th>' +
        rs.map(function (r) {
          return '<th><b>' + esc(dateCourte(r.date)) + '</b><span class="equipe ' + classeEquipe(r.equipe) + '">' + esc(abregeEquipe(r.equipe)) + '</span> ' + (r.lieu === 'Domicile' ? '🏠' : r.lieu === 'Extérieur' ? '🚗' : '') + '</th>';
        }).join('') + '<th>Répondu</th></tr></thead><tbody>';
      joueurs.forEach(function (j) {
        var n = 0, total = 0;
        html += '<tr><td class="nom">' + esc(j.nom) + '</td>' + rs.map(function (r) {
          if (j.equipes.indexOf(r.equipe) === -1) return '<td class="hors">·</td>';
          total++;
          var rep = reponseDe(r.id, j.nom);
          if (rep) n++;
          // Le capitaine touche la case : – → ✅ → ❌ → –
          return '<td class="case ' + (rep === 'Présent' ? 'oui' : rep === 'Absent' ? 'non' : 'vide') + '">' +
            '<button data-cap-rep="' + esc(r.id) + '" data-cap-nom="' + esc(j.nom) + '">' +
            (rep === 'Présent' ? '✅' : rep === 'Absent' ? '❌' : '–') + '</button></td>';
        }).join('') + '<td>' + n + '/' + total + '</td></tr>';
      });
      html += '</tbody><tfoot><tr><td class="nom">Dispos</td>' + rs.map(function (r) {
        return '<td class="total">' + bilan(r).presents.length + '</td>';
      }).join('') + '<td></td></tr></tfoot></table></div>' +
        '<p class="legende">✅ dispo · ❌ pas dispo · – pas encore répondu. Touche une case pour changer la réponse du joueur.' +
        (filtreJour ? ' Joueurs triés : dispos d\'abord.' : ' Fais glisser le tableau vers la gauche pour voir tous les matchs.') + '</p>';
      return html + '</div>';
    }

    function ecranJoueurs() {

            }).join('') + '</select>' : '') +
          '<button data-renommer="' + esc(j.nom) + '">✏️</button>' +

    // ======================= Classements =======================
    // Saisis par les capitaines. Les classements FFT peuvent changer chaque mois :
    // au-delà de JOURS_CLASSEMENT jours sans vérification, le classement est « à vérifier ».
    var JOURS_CLASSEMENT = 31;

    function rangClassement(j) { return (donnees.classements || []).indexOf(j.classement || ''); }
    function classementPerime(j) {
      if (!j.classement || !j.classementLe) return true;
      return (Date.now() - new Date(j.classementLe + 'T12:00:00')) / 86400000 > JOURS_CLASSEMENT;
    }
    function classementsAVerifier() { return donnees.joueurs.filter(classementPerime).length; }
    function pastilleClassement(j) { return j.classement ? '<span class="clt">' + esc(j.classement) + '</span>' : ''; }
    /** Meilleur classement d'abord, puis non classés ; à égalité, ordre alphabétique. */
    function parClassement(a, b) { return rangClassement(b) - rangClassement(a) || a.nom.localeCompare(b.nom, 'fr'); }

    function ecranClassements() {
      var html = enTeteCap('🎾 Classements');
      if (!donnees.classements) return html + '<div class="vide">Mise à jour en cours : recharge la page dans une minute.</div></div>';
      var n = classementsAVerifier();
      html += '<p class="sous">Les classements FFT peuvent changer chaque mois. Choisis le classement de chaque joueur, ' +
        'ou touche <b>✓ Bon</b> s\'il n\'a pas changé.' + (n ? ' <b>' + n + ' à vérifier.</b>' : ' Tout est à jour.') + '</p>' +
        '<button class="gros second" data-vue="cap-import" style="margin:0 0 14px">📥 Importer la liste FFT (Excel)</button>';
      html += '<div class="carte">' + donnees.joueurs.map(function (j) {
        var perime = classementPerime(j);
        var detail = !j.classement ? '<span class="pastille manque">pas de classement</span>'
          : 'vérifié le ' + esc(dateCourte(j.classementLe)) + (perime ? ' <span class="pastille manque">à vérifier</span>' : '');
        return '<div class="joueur"><div class="qui-j"><b>' + esc(j.nom) + '</b><small>' + detail + '</small></div>' +
          '<div class="actions-j"><select aria-label="Classement de ' + esc(j.nom) + '" data-classement-joueur="' + esc(j.nom) + '">' +
          '<option value="">—</option>' + donnees.classements.slice().reverse().map(function (c) {
            return '<option' + (c === j.classement ? ' selected' : '') + '>' + esc(c) + '</option>';
          }).join('') + '</select>' +
          (j.classement && perime ? '<button data-toujours-bon="' + esc(j.nom) + '">✓ Bon</button>' : '') + '</div></div>';
      }).join('') + '</div>';
      return html + '</div>';
    }

    // --- Import de la liste des adhérents exportée de l'espace dirigeant FFT ---
    // Le fichier est lu dans le téléphone : seuls nom, prénom, licence et classement partent au serveur.
    var URL_XLSX = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';

    function ecranImport() {
      var html = enTeteCap('📥 Importer la liste FFT', 'cap-classements', 'Classements') +
        '<p class="sous">Dans l\'espace dirigeant FFT, exporte la liste des adhérents (Excel), puis choisis le fichier ici. ' +
        'Seuls le nom, le prénom, la licence et le classement sont lus : le reste du fichier ne quitte pas ton téléphone.</p>' +
        '<input class="fichier" type="file" id="fichier-import" accept=".xls,.xlsx,.csv">';
      if (!importPlan) return html + '</div>';
      var p = importPlan, deja = [], nouveaux = [], cibles = ciblesImport();
      p.entrees.forEach(function (e) { (e.existant || cibles[e.nom] ? deja : nouveaux).push(e); });
      var ligneChangement = function (e) {
        var ancien = e.existant || cibles[e.nom], j = joueur(ancien) || {}, notes = [];
        if (ancien !== e.nom) notes.push(esc(ancien) + ' → ' + esc(e.nom));
        if ((j.classement || '') !== e.classement) notes.push(esc((j.classement || '—') + ' → ' + (e.classement || '—')));
        return '<div class="import-ligne"><b>' + esc(e.nom) + pastilleClassement({ classement: e.classement }) + '</b><small>' +
          (notes.length ? notes.join('<br>') : 'inchangé') + '</small></div>';
      };
      html += '<div class="info">' + p.entrees.length + ' licencié' + (p.entrees.length > 1 ? 's' : '') + ' dans le fichier' +
        (p.ignores ? ' (' + p.ignores + ' femme' + (p.ignores > 1 ? 's' : '') + ' ignorée' + (p.ignores > 1 ? 's' : '') + ' : équipes Hommes)' : '') + '.</div>';
      if (deja.length) html += '<p class="groupe-titre">Déjà dans l\'appli (' + deja.length + ')</p><div class="carte">' + deja.map(ligneChangement).join('') + '</div>';
      if (nouveaux.length) html += '<p class="groupe-titre">Nouveaux joueurs (' + nouveaux.length + ')</p><div class="carte">' + nouveaux.map(function (e) {
        return '<div class="import-ligne"><b>' + esc(e.nom) + pastilleClassement({ classement: e.classement }) + '</b><small>ajouté</small></div>';
      }).join('') + '</div>';
      if (p.orphelins.length) {
        var libres = p.entrees.filter(function (e) { return !e.existant; });
        html += '<p class="groupe-titre">Dans l\'appli mais pas dans le fichier (' + p.orphelins.length + ')</p>' +
          '<p class="sous">Un joueur inscrit avec un autre nom ? Choisis qui c\'est : il garde ses réponses.</p><div class="carte">' +
          p.orphelins.map(function (a) {
            var v = p.choix[a] || '';
            return '<div class="import-ligne"><b>' + esc(a) + '</b><select data-import-orphelin="' + esc(a) + '">' +
              '<option value="">Garder tel quel</option>' +
              '<option value="supprimer"' + (v === 'supprimer' ? ' selected' : '') + '>Supprimer (et ses réponses)</option>' +
              libres.map(function (e) {
                if (cibles[e.nom] && cibles[e.nom] !== a) return ''; // déjà attribué à un autre
                return '<option value="=' + esc(e.nom) + '"' + (v === '=' + e.nom ? ' selected' : '') + '>C\'est ' + esc(e.nom) + '</option>';
              }).join('') + '</select></div>';
          }).join('') + '</div>';
      }
      return html + '<button class="gros" id="lancer-import">Importer</button></div>';
    }

    /** Nom du fichier → ancien nom dans l'appli, d'après les choix « C'est … ». */
    function ciblesImport() {
      var cibles = {};
      Object.keys(importPlan.choix).forEach(function (a) {
        if (importPlan.choix[a].indexOf('=') === 0) cibles[importPlan.choix[a].slice(1)] = a;
      });
      return cibles;
    }

    function chargerXlsx(ensuite) {
      if (window.XLSX) return ensuite();
      var script = document.createElement('script');
      script.src = URL_XLSX;
      script.onload = ensuite;
      script.onerror = function () { afficherErreur('Lecture du fichier impossible : vérifie ta connexion.'); };
      document.head.appendChild(script);
    }

    function lireFichierImport(fichier) {
      chargerXlsx(function () {
        var lecteur = new FileReader();
        lecteur.onload = function () {
          try {
            importPlan = planImport(XLSX.read(new Uint8Array(lecteur.result), { type: 'array' }));
          } catch (err) {
            importPlan = null;
            afficherErreur(err.message);
          }
          rendre();
        };
        lecteur.readAsArrayBuffer(fichier);
      });
    }

    /** Lignes du fichier → joueurs à importer, rapprochés des joueurs déjà dans l'appli. */
    function planImport(classeur) {
      var lignes = null, col = null;
      classeur.SheetNames.some(function (nomOnglet) {
        var rangees = XLSX.utils.sheet_to_json(classeur.Sheets[nomOnglet], { header: 1, defval: '', raw: false });
        return rangees.some(function (r, i) {
          var t = r.map(function (c) { return String(c).trim(); });
          var c = { nom: t.indexOf('Nom'), prenom: t.indexOf('Prénom'), licence: t.indexOf('Licence'), sexe: t.indexOf('Sexe'),
            classement: t.indexOf('Class.') !== -1 ? t.indexOf('Class.') : t.indexOf('Dernier class. tennis') };
          if (c.nom === -1 || c.prenom === -1 || c.licence === -1 || c.classement === -1) return false;
          lignes = rangees.slice(i + 1);
          col = c;
          return true;
        });
      });
      if (!lignes) throw new Error('Fichier non reconnu : il faut les colonnes Nom, Prénom, Licence et Class. (export « Liste des adhérents »).');
      var ignores = 0, entrees = [];
      lignes.forEach(function (r) {
        var nom = String(r[col.nom] || '').trim(), prenom = String(r[col.prenom] || '').trim();
        if (!nom || !prenom) return;
        if (col.sexe !== -1 && String(r[col.sexe]).trim() === 'F') { ignores++; return; }
        var clt = String(r[col.classement] || '').trim();
        var initiale = (nom.normalize('NFC').match(/\p{L}/u) || [''])[0].toUpperCase();
        entrees.push({ nom: nettoyerNom(prenom) + ' ' + initiale, complet: nettoyerNom(prenom + ' ' + nom),
          licence: String(r[col.licence] || '').trim().toUpperCase(), classement: (donnees.classements || []).indexOf(clt) !== -1 ? clt : '' });
      });
      if (!entrees.length) throw new Error('Aucun licencié trouvé dans le fichier.');
      // Même prénom et même initiale : nom complet pour les deux.
      var vus = {};
      entrees.forEach(function (e) { vus[cleNom(e.nom)] = (vus[cleNom(e.nom)] || 0) + 1; });
      entrees.forEach(function (e) { if (vus[cleNom(e.nom)] > 1) e.nom = e.complet; });
      var pris = {};
      entrees.forEach(function (e) {
        var j = donnees.joueurs.filter(function (x) {
          return !pris[x.nom] && (cleNom(x.nom) === cleNom(e.nom) || cleNom(x.nom) === cleNom(e.complet));
        })[0];
        if (j) { e.existant = j.nom; pris[j.nom] = true; }
      });
      var orphelins = donnees.joueurs.filter(function (j) { return !pris[j.nom]; }).map(function (j) { return j.nom; });
      return { entrees: entrees, orphelins: orphelins, ignores: ignores, choix: {} };
    }

    function lancerImport() {
      var supprimer = Object.keys(importPlan.choix).filter(function (a) { return importPlan.choix[a] === 'supprimer'; });
      if (supprimer.length && !confirm('Supprimer ' + supprimer.join(', ') + ' et toutes leurs réponses ?')) return;
      var cibles = ciblesImport();
      var envoi = importPlan.entrees.map(function (e) {
        return { nom: e.nom, ancien: e.existant || cibles[e.nom] || '', licence: e.licence, classement: e.classement };
      });
      appelCap('importerJoueurs', [envoi, supprimer], function (b) {
        var n = function (x, mot) { return x.length + ' ' + mot + (x.length > 1 ? 's' : ''); };
        importPlan = null;
        messageCap = 'Import terminé : ' + n(b.ajoutes, 'ajouté') + ', ' + n(b.classements, 'classement') + ' modifié' + (b.classements.length > 1 ? 's' : '') +
          (b.renommes.length ? ', ' + n(b.renommes, 'renommé') : '') + (b.supprimes.length ? ', ' + n(b.supprimes, 'supprimé') : '') + '.';
        allerA('cap-classements', true);
      });
    }

    function definirFige(nom, equipe) {
      var j = joueur(nom);
      if (!j) return;
      var avant = j.equipes;
      j.equipes = equipe ? [equipe] : donnees.equipes.slice();
      messageCap = equipe ? nom + ' est figé en ' + equipe + '.' : nom + ' peut jouer dans toutes les équipes.';
      rendre();
      serveur()
        .withSuccessHandler(function (r) { j.equipes = r.equipes; })
        .withFailureHandler(function (err) {
          j.equipes = avant;
          messageCap = '';
          rendre();
          var msg = err && err.message ? err.message : 'problème de connexion';
          if (/expirée/.test(msg)) deconnexionCap();
          afficherErreur('Non enregistré : ' + msg);
        })
        .definirFige(jeton, nom, equipe);

    function definirClassement(nom, classement) {
      var j = joueur(nom);
      if (!j) return;
      var avant = { classement: j.classement, classementLe: j.classementLe };
      j.classement = classement;
      j.classementLe = classement ? new Date().toISOString().slice(0, 10) : '';
      rendre();
      serveur()
        .withSuccessHandler(function (r) { j.classement = r.classement; j.classementLe = r.classementLe; })
        .withFailureHandler(function (err) {
          j.classement = avant.classement;
          j.classementLe = avant.classementLe;
          rendre();
          var msg = err && err.message ? err.message : 'problème de connexion';
          if (/expirée/.test(msg)) deconnexionCap();
          afficherErreur('Classement non enregistré : ' + msg);
        })
        .definirClassement(jeton, nom, classement);

    // ======================= Sélection =======================

    function selectionDe(id) { return (donnees.selection || {})[id] || {}; }
    function nomsRole(id, role) {
      var sel = selectionDe(id);
      return Object.keys(sel).filter(function (n) { return sel[n] === role; }).sort(function (a, b) { return a.localeCompare(b, 'fr'); });

    function ecranSelection() {
      var html = enTeteCap('Sélection');
      if (!donnees.rencontres.length) return html + '<div class="vide">Aucune rencontre à venir.</div></div>';

    function ecranSelectionMatch() {
      var r = donnees.rencontres.filter(function (x) { return x.id === selId; })[0];
      if (!r) { selId = ''; return ecranSelection(); }
      var sel = selectionDe(r.id);

      var html = '<div class="cap"><button class="retour" id="retour-selection">← Tous les matchs</button>' +
        '<h2>' + titreMatch(r) + '</h2>' +
        '<p class="sous">' + esc(dateLongue(r.date)) + ' · ' + esc(r.heure || 'heure à venir') + ' · ' +

          var nom = occupant['N°' + k];
          return '<span class="num">n°' + k + '</span>' + (nom ? '<span>' + esc(nom) + (joueur(nom) ? pastilleClassement(joueur(nom)) : '') + '</span>' : '<span class="libre">à choisir</span>');
        }).join('') +
        (nomsRole(r.id, 'Remplaçant').length ? '<span class="num">🔄</span><span>' + esc(nomsRole(r.id, 'Remplaçant').join(', ')) + '</span>' : '') +
        '</div></div>';
      var groupes = [['Présent', '✅ Dispos'], ['', '… Pas encore répondu'], ['Absent', '❌ Pas dispos']];
      var joueurs = joueursEquipe(r.equipe);
      html += groupes.map(function (g) {
        var js = joueurs.filter(function (j) { return reponseDe(r.id, j.nom) === g[0]; }).sort(parClassement);
        if (!js.length) return '';
        return '<p class="groupe-titre">' + g[1] + ' (' + js.length + ')</p><div class="carte">' + js.map(function (j) {
          var role = sel[j.nom] || '';
          var ailleurs = autresDuJour.filter(function (x) { return selectionDe(x.id)[j.nom]; })[0];
          return '<div class="sel-joueur"><div class="tete"><b>' + esc(j.nom) + pastilleClassement(j) + '</b>' +
            (ailleurs ? '<span class="avert">⚠️ déjà retenu en ' + esc(ailleurs.equipe) + '</span>' : '') + '</div>' +
            '<div class="choix">' + pos.map(function (k) { return ['N°' + k, 'n°' + k]; }).concat([['Remplaçant', '🔄 Remp.'], ['', '—']]).map(function (c) {
              return '<button type="button" data-role="' + c[0] + '" data-joueur="' + esc(j.nom) + '"' + (role === c[0] ? ' class="choisi"' : '') + '>' + c[1] + '</button>';
            }).join('') + '</div></div>';
        }).join('') + '</div>';
      }).join('');
      var texte = texteComposition(r);
      html += '<div class="partage"><a href="https://wa.me/?text=' + encodeURIComponent(texte) + '" target="_blank" rel="noopener">📤 WhatsApp</a>' +
        '<button id="copier-compo">📋 Copier</button></div></div>';
      return html;
    }

    function texteComposition(r) {
      var t = ordreDeJeu(r.id), rp = nomsRole(r.id, 'Remplaçant');
      var chiffres = ['', '1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣'];
      return '🎾 TC Bazoges – ' + r.equipe + ' vs ' + (r.adversaire || 'adversaire à venir') + '\n' +
        '📅 ' + dateLongue(r.date) + (r.heure ? ' · ' + r.heure : '') +
        (r.lieu === 'Domicile' ? ' · 🏠 Domicile' : r.lieu === 'Extérieur' ? ' · 🚗 Extérieur' : '') +
        (r.terrains ? ' · 🎾 ' + r.terrains + ' terrain' + (r.terrains === '2' ? 's' : '') : '') + '\n' +
        '🏆 Ordre de jeu (simples) :' + (t.length ? '\n' + t.map(function (x) { return (chiffres[x.n] || '•') + ' ' + x.nom + (joueur(x.nom) && joueur(x.nom).classement ? ' (' + joueur(x.nom).classement + ')' : ''); }).join('\n') : ' à venir') + '\n' +
        (rp.length ? '🔄 Remplaçant' + (rp.length > 1 ? 's' : '') + ' : ' + rp.join(', ') + '\n' : '') +
        (r.infos ? 'ℹ️ ' + r.infos + '\n' : '') +
        '👉 ' + (surAppsScript ? URL_API : location.origin + location.pathname);
    }

    function copierTexte(texte) {
      function secours() {
        var zone = document.createElement('textarea');
        zone.value = texte;
        document.body.appendChild(zone);
        zone.select();
        try { document.execCommand('copy'); afficherInfo('Composition copiée : colle-la dans WhatsApp.'); }
        catch (e) { afficherErreur('Copie impossible : utilise le bouton WhatsApp.'); }
        document.body.removeChild(zone);
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(texte).then(function () { afficherInfo('Composition copiée : colle-la dans WhatsApp.'); }, secours);
      } else {
        secours();
      }
    }

    function definirRole(nom, role) {
      var sel = donnees.selection = donnees.selection || {};
      sel[selId] = sel[selId] || {};
      var ancien = sel[selId][nom] || '';
      if (ancien === role) return;
      var avant = Object.assign({}, sel[selId]);
      if (role && role !== 'Remplaçant') {
        Object.keys(sel[selId]).forEach(function (n) { if (n !== nom && sel[selId][n] === role) delete sel[selId][n]; });
      }
      if (role) sel[selId][nom] = role; else delete sel[selId][nom];
      rendre();
      var id = selId;
      selEnCours++;
      serveur()
        .withSuccessHandler(function (selection) {
          // Une réponse plus ancienne ne doit pas effacer un choix fait entre-temps.
          if (--selEnCours === 0) { donnees.selection = selection; if (vue === 'cap-selection') rendre(); }
        })
        .withFailureHandler(function (err) {
          selEnCours--;
          sel[id] = avant;
          rendre();
          var msg = err && err.message ? err.message : 'problème de connexion';
          if (/expirée/.test(msg)) deconnexionCap();
          afficherErreur('Sélection non enregistrée : ' + msg);
        })
        .definirSelection(jeton, id, nom, role);
    }

    // --- Historique : le bouton retour du téléphone revient à l'écran précédent au lieu de quitter ---
    // pile[i] = écran de l'entrée i de l'historique ; pos = entrée affichée.
    // (Sur Apps Script la page est dans un cadre : on laisse l'historique tel quel.)
    var pile = [{ vue: 'accueil', sel: '' }], pos = 0;
    var garderMessage = false; // message à afficher après un retour en arrière (ex. « Rencontre modifiée »)
    if (!surAppsScript) {
      try { history.replaceState({ i: 0, vue: 'accueil', sel: '' }, ''); } catch (e) {}
      window.addEventListener('popstate', function (e) {
        var etat = e.state && typeof e.state.i === 'number' ? e.state : { i: 0, vue: 'accueil', sel: '' };
        pos = etat.i;
        pile[pos] = { vue: etat.vue, sel: etat.sel || '' };
        afficherEcran(pile[pos]);
      });
    }

    function afficherEcran(etat) {
      selId = etat.vue === 'cap-selection' || etat.vue === 'cap-resultats' ? etat.sel : '';
      renommage = null;
      lignesFigees = null;
      if (etat.vue !== vue && !garderMessage) messageCap = '';
      garderMessage = false;
      vue = etat.vue;
      if (donnees) rendre();
      window.scrollTo(0, 0);
    }

    /** Va à un écran : revient en arrière s'il est déjà dans l'historique, sinon ajoute une entrée. */
    function naviguer(etat, avecMessage) {
      etat = { vue: etat.vue, sel: etat.sel || '' };
      garderMessage = !!avecMessage;
      if (surAppsScript) { afficherEcran(etat); return; }
      for (var i = pos; i >= 0; i--) {
        if (pile[i] && pile[i].vue === etat.vue && pile[i].sel === etat.sel) {
          if (i === pos) afficherEcran(etat); else history.go(i - pos); // popstate affichera l'écran
          return;
        }
      }
      pile = pile.slice(0, pos + 1);
      pile.push(etat);
      pos++;
      try { history.pushState({ i: pos, vue: etat.vue, sel: etat.sel }, ''); } catch (e) {}
      afficherEcran(etat);
    }

    function allerA(nouvelleVue, avecMessage) { naviguer({ vue: nouvelleVue }, avecMessage); }

    function appelCap(fonction, args, succes) {
      var boutons = document.querySelectorAll('#contenu button');
      Array.prototype.forEach.call(boutons, function (b) { b.disabled = true; });
      var run = serveur()
        .withSuccessHandler(function (r) {
          donneesCap = r;
          succes(r);
          charger(); // met à jour la page des joueurs avec la Sheet
        })
        .withFailureHandler(function (err) {
          Array.prototype.forEach.call(boutons, function (b) { b.disabled = false; });
          var msg = err && err.message ? err.message : 'problème de connexion';
          if (/expirée/.test(msg)) { deconnexionCap(); }
          afficherErreur(msg);
        });
      run[fonction].apply(run, [jeton].concat(args));
    }

    function verifierCapitaine() {
      if (!jeton) return;
      serveur()
        .withSuccessHandler(function (info) {
          capitaine = info.email;
          if (jetonDuLien) afficherInfo('Connecté comme capitaine (' + capitaine + '). L\'espace capitaines est sous ⚙️ en haut à droite.');
          rendre();

        .withFailureHandler(function () {
          deconnexionCap();
          if (VUES_JOUEURS.indexOf(vue) === -1) { messageCap = 'Ce lien n\'est plus valable : redemande un lien de connexion.'; rendre(); }
        })
        .infoCapitaine(jeton);
    }

    function deconnexionCap() {
      capitaine = null;
      jeton = '';
      ecrireJeton('');
    }

    document.addEventListener('click', function (e) {
      var cible = e.target.closest('button');

      } else if (cible.hasAttribute('data-basculer')) {

        var modif = Object.assign({}, r, { statut: r.statut === 'Validée' ? 'En attente' : 'Validée' });
        appelCap('enregistrerRencontre', [modif], function () {
          messageCap = modif.equipe + ' du ' + dateDansPhrase(modif.date) + (modif.statut === 'Validée' ? ' : date validée.' : ' : remise en attente.');
        });

          ' ? Les réponses des joueurs à ce match seront aussi supprimées.')) return;
        var supprimee = edition;
