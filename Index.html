<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --fond: #f5f5f2;
      --carte: #ffffff;
      --texte: #1a1a1a;
      --doux: #5f5f5a;
      --ligne: #e2e2dc;
      --noir: #151515;
      --jaune: #f5c000;
      --jaune-fonce: #c99c00;
      --vert: #1f7a45;
      --vert-clair: #e2f3e8;
      --rouge: #c0392b;
      --rouge-clair: #fbe7e4;
      --orange: #a8640a;
      --orange-clair: #fdf1dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #121212;
        --carte: #1d1d1b;
        --texte: #ededea;
        --doux: #a8a8a2;
        --ligne: #34342f;
        --noir: #000000;
        --jaune-fonce: #f5c000;
        --vert: #4cc27c;
        --vert-clair: #183324;
        --rouge: #f07c6e;
        --rouge-clair: #3a1d19;
        --orange: #f0b45a;
        --orange-clair: #3a2a12;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      background: var(--noir);
      border-bottom: 4px solid var(--jaune);
      color: #fff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .titre { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    h1 { font-size: 19px; margin: 0; display: flex; align-items: center; gap: 10px; line-height: 1.2; }
    h1 .sous-titre { color: var(--jaune); }
    .logo { width: 48px; height: 48px; flex: none; border-radius: 50%; background: #fff; padding: 2px; }
    .moi { font-size: 15px; opacity: .9; }
    .moi button {
      background: none; border: 0; color: inherit; text-decoration: underline;
      font: inherit; padding: 4px 0; cursor: pointer;
    }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    .carte {
      background: var(--carte);
      border: 1px solid var(--ligne);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .jour { font-weight: 700; margin: 0 0 6px; border-left: 4px solid var(--jaune); padding-left: 8px; }
    .ligne-info { color: var(--doux); font-size: 15px; }
    .match { font-size: 18px; font-weight: 600; margin: 6px 0; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .badge {
      font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px;
      background: var(--fond); color: var(--doux);
    }
    .badge.validee { background: var(--vert-clair); color: var(--vert); }
    .badge.attente { background: var(--orange-clair); color: var(--orange); }
    .infos { background: var(--fond); border-radius: 8px; padding: 8px 10px; font-size: 15px; margin: 8px 0; }
    .boutons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 6px; }
    .boutons button {
      min-height: 56px; border-radius: 12px; font-weight: 700; font-size: 17px; font-family: inherit;
      border: 2px solid var(--ligne); background: var(--carte); color: var(--texte); cursor: pointer;
    }
    .boutons button.oui.choisi { background: var(--vert); border-color: var(--vert); color: #fff; }
    .boutons button.non.choisi { background: var(--rouge); border-color: var(--rouge); color: #fff; }
    .boutons button:disabled { opacity: .6; }
    .aide { font-size: 13px; color: var(--doux); text-align: center; }
    details { margin-top: 8px; font-size: 15px; }
    summary { cursor: pointer; color: var(--doux); padding: 4px 0; }
    .liste { margin: 4px 0 0; padding-left: 4px; }
    .liste b { display: inline-block; min-width: 130px; }
    .alerte {
      background: var(--rouge-clair); color: var(--rouge); font-weight: 600;
      border-radius: 10px; padding: 10px 12px; margin: 8px 0;
    }
    .rencontre { border-top: 1px solid var(--ligne); padding: 10px 0; }
    .jour + .rencontre, .alerte + .rencontre { border-top: 0; padding-top: 4px; }
    .rencontre .match { font-size: 16px; margin: 2px 0; }
    .compte { font-size: 14px; color: var(--doux); }
    .qui h2 { margin: 4px 0 4px; font-size: 22px; }
    .qui p { color: var(--doux); margin: 0 0 14px; }
    .qui label { display: block; font-weight: 600; margin-bottom: 8px; }
    .qui input {
      width: 100%; min-height: 54px; border-radius: 12px; border: 2px solid var(--ligne);
      background: var(--carte); color: var(--texte); font-size: 19px; font-family: inherit; padding: 0 14px;
    }
    .qui input:focus { outline: none; border-color: var(--jaune-fonce); }
    .gros {
      width: 100%; min-height: 56px; margin-top: 12px; border-radius: 12px; border: 0;
      background: var(--jaune); color: #151515; font-weight: 700; font-size: 18px; font-family: inherit; cursor: pointer;
    }
    .gros.second { background: var(--carte); color: var(--texte); border: 2px solid var(--ligne); }
    .gros:disabled { opacity: .6; }
    .lien { background: none; border: 0; color: var(--doux); text-decoration: underline; font: inherit; padding: 12px 0; cursor: pointer; }
    .vide, .chargement { text-align: center; color: var(--doux); padding: 40px 0; }
    .erreur {
      position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 3;
      background: var(--rouge); color: #fff; border-radius: 12px; padding: 12px 14px; font-weight: 600;
    }
    .pied { text-align: center; margin: 8px 0 24px; font-size: 14px; }
    .pied a { color: var(--doux); }
    [hidden] { display: none !important; }
  </style>
</head>

      <div class="moi" id="moi" hidden></div>

  </header>

  <main id="contenu"><div class="chargement">Chargement…</div></main>
  <div class="erreur" id="erreur" hidden></div>

  <script>
    var CLE_NOM = 'tcb-championnat-nom';
    var donnees = null;
    var enCours = {}; // rencontres dont la réponse part au serveur
    var inscription = { nom: '', choixGroupe: false, envoi: false };

    // --- Mémoire du téléphone (peut être indisponible en navigation privée) ---
    function lireNom() { try { return localStorage.getItem(CLE_NOM); } catch (e) { return null; } }
    function ecrireNom(nom) {
      try { nom ? localStorage.setItem(CLE_NOM, nom) : localStorage.removeItem(CLE_NOM); } catch (e) {}
    }
    var moi = lireNom();

    // --- Outils ---
    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function dateLongue(iso) {
      var p = iso.split('-');
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      var texte = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      return texte.charAt(0).toUpperCase() + texte.slice(1);
    }
    function compte(n, singulier, pluriel) {
      return n + ' ' + (n > 1 ? pluriel : singulier);
    }
    function joueur(nom) {
      return donnees.joueurs.filter(function (j) { return j.nom === nom; })[0];
    }
    function joueursEquipe(equipe) {
      return donnees.joueurs.filter(function (j) { return j.equipes.indexOf(equipe) !== -1; });
    }
    function reponseDe(id, nom) {
      return (donnees.reponses[id] || {})[nom] || '';
    }
    function bilan(r) {
      var presents = [], absents = [], sansReponse = [];
      joueursEquipe(r.equipe).forEach(function (j) {
        var rep = reponseDe(r.id, j.nom);
        (rep === 'Présent' ? presents : rep === 'Absent' ? absents : sansReponse).push(j.nom);
      });
      return { presents: presents, absents: absents, sansReponse: sansReponse };
    }
    function afficherErreur(message) {
      var el = document.getElementById('erreur');
      el.textContent = message;
      el.hidden = false;
      clearTimeout(afficherErreur.t);
      afficherErreur.t = setTimeout(function () { el.hidden = true; }, 5000);
    }
    function badgeStatut(r) {
      return r.statut === 'Validée'
        ? '<span class="badge validee">✅ Date validée</span>'
        : '<span class="badge attente">⏳ En attente de convocation</span>';
    }
    function badgeLieu(r) {
      var texte = r.lieu === 'Domicile' ? '🏠 Domicile' : r.lieu === 'Extérieur' ? '🚗 Extérieur' : '📍 Lieu à venir';
      return '<span class="badge">' + texte + '</span>';
    }

    // --- Écrans ---
    function rendre() {
      var contenu = document.getElementById('contenu');
      var zoneMoi = document.getElementById('moi');

      if (!donnees) return;
      var champ = document.getElementById('champ-nom');
      if (champ && !inscription.choixGroupe) inscription.nom = champ.value;

      if (!moi || !joueur(moi)) {
        moi = null;
        zoneMoi.hidden = true;
        contenu.innerHTML = ecranQui();
        return;
      }

      zoneMoi.hidden = false;
      zoneMoi.innerHTML = esc(moi) + ' · <button id="changer">changer</button>';
      contenu.innerHTML = ecranListe();
    }

    /** Même clé que côté serveur : sans accents, majuscules, points ni espaces. */
    function cleNom(texte) {
      return String(texte).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');
    }
    /** « julien  c » → « Julien C » (même règle que côté serveur). */
    function nettoyerNom(texte) {
      return String(texte || '').trim().replace(/\s+/g, ' ').toLowerCase()
        .replace(/(^|[\s'-])(\p{L})/gu, function (m, sep, lettre) { return sep + lettre.toUpperCase(); });
    }
    function joueurParSaisie(texte) {
      var cle = cleNom(texte);
      return donnees.joueurs.filter(function (j) { return cleNom(j.nom) === cle; })[0];
    }

    function ecranQui() {
      var html = '<div class="qui"><h2>Qui es-tu ?</h2>';
      if (!inscription.choixGroupe) {
        return html + '<p>La première fois seulement : ton téléphone s\'en souviendra.</p>' +
          '<form id="form-nom"><label for="champ-nom">Ton prénom et l\'initiale de ton nom</label>' +
          '<input id="champ-nom" placeholder="ex. Julien C." autocomplete="name" autocapitalize="words" maxlength="40" value="' +
            esc(inscription.nom) + '">' +
          '<button class="gros" type="submit">Continuer</button></form></div>';
      }
      html += '<p>Bienvenue <b>' + esc(inscription.nom) + '</b> ! Tu joues dans quelle équipe ?</p>';
      donnees.groupes.forEach(function (g) {
        html += '<button class="gros second" data-groupe="' + esc(g) + '"' +
          (inscription.envoi ? ' disabled' : '') + '>' + esc(g) + '</button>';
      });
      return html + '<button class="lien" id="corriger-nom">← Corriger mon nom</button></div>';
    }

    /** Tous les matchs du club, par date ; chacun peut répondre sur chaque match. */
    function ecranListe() {
      var pied = '<p class="pied"><a href="' + esc(donnees.lienCapitaines) + '" target="_blank" rel="noopener">⚙️ Espace capitaines</a></p>';
      if (!donnees.rencontres.length) return '<div class="vide">Aucune rencontre à venir.</div>' + pied;
      return parJour(donnees.rencontres).map(function (j) {
        var domicile = j.rencontres.filter(function (r) { return r.lieu === 'Domicile'; }).length;
        var html = '<div class="carte"><p class="jour">' + esc(dateLongue(j.date)) + '</p>';
        if (domicile > donnees.maxDomicileParJour) {
          html += '<div class="alerte">⚠️ ' + domicile + ' rencontres à domicile ce jour-là, pour ' +
            donnees.nbTerrains + ' terrains.</div>';
        }
        return html + j.rencontres.map(carteRencontre).join('') + '</div>';
      }).join('') + pied;
    }

    function parJour(rencontres) {
      var jours = [], index = {};
      rencontres.forEach(function (r) {
        if (!(r.date in index)) { index[r.date] = jours.length; jours.push({ date: r.date, rencontres: [] }); }
        jours[index[r.date]].rencontres.push(r);
      });
      return jours;
    }

    function carteRencontre(r) {
      var rep = reponseDe(r.id, moi);
      var b = bilan(r);
      var occupe = enCours[r.id] ? ' disabled' : '';
      return '<div class="rencontre">' +
        '<div class="match">' + esc(r.equipe) + ' – ' + esc(r.adversaire || 'Adversaire à venir') + '</div>' +
        '<div class="ligne-info">' + esc(r.heure || 'Heure à venir') + '</div>' +
        '<div class="badges">' + badgeStatut(r) + badgeLieu(r) + '</div>' +
        (r.infos ? '<div class="infos">' + esc(r.infos) + '</div>' : '') +
        '<div class="boutons">' +
          '<button class="oui' + (rep === 'Présent' ? ' choisi' : '') + '" data-id="' + esc(r.id) + '" data-rep="Présent"' + occupe + '>' +
            (rep === 'Présent' ? '✅ ' : '') + 'Je suis dispo</button>' +
          '<button class="non' + (rep === 'Absent' ? ' choisi' : '') + '" data-id="' + esc(r.id) + '" data-rep="Absent"' + occupe + '>' +
            (rep === 'Absent' ? '❌ ' : '') + 'Pas dispo</button>' +
        '</div>' +
        (rep ? '<div class="aide">Touche à nouveau pour annuler ta réponse.</div>' : '') +
        '<details><summary>' + compte(b.presents.length, 'dispo', 'dispos') + ' · ' +
          compte(b.absents.length, 'pas dispo', 'pas dispos') + ' · ' + b.sansReponse.length + ' sans réponse</summary><div class="liste">' +
          ligneNoms('✅ Dispos', b.presents) +
          ligneNoms('❌ Pas dispos', b.absents) +
          ligneNoms('… Pas répondu', b.sansReponse) +
        '</div></details>' +
        '</div>';
    }

    function ligneNoms(titre, noms) {
      return '<div><b>' + titre + '</b> ' + (noms.length ? esc(noms.join(', ')) : '–') + '</div>';
    }

    function repondre(id, rep) {
      var ancienne = reponseDe(id, moi);
      var nouvelle = ancienne === rep ? '' : rep; // toucher à nouveau = annuler

      // Affichage immédiat, corrigé si le serveur refuse.
      donnees.reponses[id] = donnees.reponses[id] || {};
      if (nouvelle) donnees.reponses[id][moi] = nouvelle; else delete donnees.reponses[id][moi];
      enCours[id] = true;
      rendre();

      google.script.run
        .withSuccessHandler(function (reponses) {
          delete enCours[id];
          donnees.reponses = reponses;
          rendre();
        })
        .withFailureHandler(function (err) {
          delete enCours[id];
          if (ancienne) donnees.reponses[id][moi] = ancienne; else delete donnees.reponses[id][moi];
          rendre();
          afficherErreur('Réponse non enregistrée : ' + (err && err.message ? err.message : 'problème de connexion') + '. Réessaie.');
        })
        .repondre([id], moi, nouvelle);
    }

    document.addEventListener('click', function (e) {
      var cible = e.target.closest('button');
      if (!cible) return;
      if (cible.hasAttribute('data-groupe')) {
        inscrire(cible.getAttribute('data-groupe'));
      } else if (cible.id === 'corriger-nom') {
        inscription.choixGroupe = false;
        rendre();
      } else if (cible.id === 'changer') {
        moi = null;
        ecrireNom(null);
        inscription = { nom: '', choixGroupe: false, envoi: false };
        rendre();
      } else if (cible.hasAttribute('data-rep')) {
        repondre(cible.getAttribute('data-id'), cible.getAttribute('data-rep'));
      }
    });

    document.addEventListener('submit', function (e) {
      if (e.target.id !== 'form-nom') return;
      e.preventDefault();
      var saisie = nettoyerNom(document.getElementById('champ-nom').value);
      if (cleNom(saisie).length < 2) { afficherErreur('Écris ton prénom et l\'initiale de ton nom.'); return; }
      inscription.nom = saisie;
      var existant = joueurParSaisie(saisie);
      if (existant) connecter(existant.nom);
      else { inscription.choixGroupe = true; rendre(); }
    });

    function connecter(nom) {
      moi = nom;
      ecrireNom(moi);
      inscription = { nom: '', choixGroupe: false, envoi: false };
      rendre();
      window.scrollTo(0, 0);
    }

    function inscrire(groupe) {
      inscription.envoi = true;
      rendre();
      google.script.run
        .withSuccessHandler(function (r) { donnees = r.donnees; connecter(r.nom); })
        .withFailureHandler(function (err) {
          inscription.envoi = false;
          rendre();
          afficherErreur('Inscription impossible : ' + (err && err.message ? err.message : 'problème de connexion') + '.');
        })
        .inscrire(inscription.nom, groupe);
    }

    function charger() {
      google.script.run
        .withSuccessHandler(function (d) { donnees = d; rendre(); })
        .withFailureHandler(function (err) {
          document.getElementById('contenu').innerHTML =
            '<div class="vide">Impossible de charger les rencontres.<br>' + esc(err && err.message) +
            '<br><br><button onclick="location.reload()">Réessayer</button></div>';
        })
        .getDonnees();
    }

    // Rafraîchit quand on revient sur l'onglet du navigateur (réponses des autres, nouvelles dates).
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && donnees && !Object.keys(enCours).length) charger();
    });

    charger();
  </script>
</body>
</html>
