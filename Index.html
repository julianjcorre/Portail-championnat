          allerA('cap-gerer', true);
        });
      } else if (cible.hasAttribute('data-agenda')) {
        telechargerAgenda(cible.getAttribute('data-agenda'));
      } else if (cible.id === 'installer') {
        installer();
      } else if (cible.id === 'installer-direct') {
        installerMaintenant();
      } else if (cible.id === 'mode-mail' || cible.id === 'mode-perso') {
        capEmail = (document.getElementById('cap-email') || {}).value || capEmail;
        modeMail = cible.id === 'mode-mail';
        messageCap = '';
        rendre();
      } else if (cible.id === 'deja-code') {
        capEmail = (document.getElementById('cap-email') || {}).value || capEmail;
        codeEnvoye = true;
        rendre();
      } else if (cible.hasAttribute('data-res')) {
        naviguer({ vue: 'cap-resultats', sel: cible.getAttribute('data-res') });
      } else if (cible.id === 'effacer-resultat') {
        if (!confirm('Effacer le résultat de cette rencontre ?')) return;
        enregistrerResultat([], 'Résultat effacé.');
      } else if (cible.hasAttribute('data-sel')) {
        naviguer({ vue: 'cap-selection', sel: cible.getAttribute('data-sel') });
      } else if (cible.id === 'retour-selection') {
        naviguer({ vue: 'cap-selection' });
      } else if (cible.hasAttribute('data-role')) {
        definirRole(cible.getAttribute('data-joueur'), cible.getAttribute('data-role'));
      } else if (cible.id === 'copier-compo') {
        copierTexte(texteComposition(donnees.rencontres.filter(function (x) { return x.id === selId; })[0]));
      } else if (cible.hasAttribute('data-filtre-equipe')) {
        filtreEquipe = cible.getAttribute('data-filtre-equipe');
        try { filtreEquipe ? localStorage.setItem(CLE_FILTRE_EQUIPE, filtreEquipe) : localStorage.removeItem(CLE_FILTRE_EQUIPE); } catch (e) {}
        rendre();
      } else if (cible.hasAttribute('data-filtre-reponse')) {
        filtreReponse = cible.getAttribute('data-filtre-reponse');
        lignesFigees = null;
        rendre();
      } else if (cible.hasAttribute('data-filtre-jour')) {
        filtreJour = cible.getAttribute('data-filtre-jour');
        lignesFigees = null;
        rendre();
      } else if (cible.id === 'lancer-import') {
        lancerImport();
      } else if (cible.hasAttribute('data-toujours-bon')) {
        var jb = joueur(cible.getAttribute('data-toujours-bon'));
        if (jb) definirClassement(jb.nom, jb.classement);
      } else if (cible.hasAttribute('data-renommer')) {
        renommage = cible.getAttribute('data-renommer');
        rendre();
        var champNom = document.getElementById('nouveau-nom');
        if (champNom) { champNom.focus(); champNom.select(); }
      } else if (cible.id === 'annuler-renommage') {
        renommage = null;
        rendre();
      } else if (cible.hasAttribute('data-supprimer-joueur')) {
        var nomSuppr = cible.getAttribute('data-supprimer-joueur');
        if (!confirm('Supprimer ' + nomSuppr + ' et toutes ses réponses ?')) return;
        appelCap('supprimerJoueur', [nomSuppr], function () {
          messageCap = nomSuppr + ' a été supprimé.';
          if (moi === nomSuppr) { moi = null; ecrireNom(null); }
        });
      } else if (cible.id === 'deconnexion-cap') {
        serveur().deconnecterCapitaine(jeton);
        deconnexionCap();
        modeMail = false;
        allerA('accueil');
      } else if (cible.hasAttribute('data-moi')) {
        choixMoi = cible.getAttribute('data-moi');
        rendre();
        window.scrollTo(0, 0);
      } else if (cible.id === 'confirmer-moi') {
        connecter(choixMoi);
      } else if (cible.id === 'pas-moi') {
        choixMoi = '';
        rendre();
      } else if (cible.id === 'changer') {
        moi = null;
        ecrireNom(null);
        choixMoi = '';
        rendre();
      } else if (cible.hasAttribute('data-cap-rep')) {
        repondrePour(cible.getAttribute('data-cap-rep'), cible.getAttribute('data-cap-nom'));
      } else if (cible.hasAttribute('data-rep')) {
        repondre(cible.getAttribute('data-id'), cible.getAttribute('data-rep'));
      }
    });

    document.addEventListener('change', function (e) {
      if (e.target.hasAttribute('data-classement-joueur')) definirClassement(e.target.getAttribute('data-classement-joueur'), e.target.value);
      if (e.target.id === 'fichier-import' && e.target.files[0]) lireFichierImport(e.target.files[0]);
      if (e.target.hasAttribute('data-fige-joueur')) definirFige(e.target.getAttribute('data-fige-joueur'), e.target.value);
      if (e.target.hasAttribute('data-res-joueur')) {
        // Résultat : le classement du joueur choisi se remplit tout seul (modifiable).
        var j = joueur(e.target.value), champClt = document.getElementById('clt-' + e.target.getAttribute('data-res-joueur'));
        if (champClt && j && j.classement) champClt.value = j.classement;
      }
      if (e.target.hasAttribute('data-import-orphelin') && importPlan) {
        importPlan.choix[e.target.getAttribute('data-import-orphelin')] = e.target.value;
        rendre();
      }
    });

    document.addEventListener('submit', function (e) {
      if (e.target.id === 'form-cap-connexion') {
        e.preventDefault();
        var email = document.getElementById('cap-email').value.trim();
        if (!email) { afficherErreur('Tape ton adresse e-mail.'); return; }
        var bouton = e.target.querySelector('button');
        bouton.disabled = true;
        capEmail = email;
        serveur()
          .withSuccessHandler(function (msg) { messageCap = msg; codeEnvoye = true; rendre(); })
          .withFailureHandler(function (err) { bouton.disabled = false; afficherErreur(err && err.message ? err.message : 'Envoi impossible.'); })
          .demanderLienCapitaine(email);
        return;
      }
      if (e.target.id === 'form-cap-code') {
        e.preventDefault();
        var email2 = (document.getElementById('cap-email').value || capEmail).trim();
        var code = document.getElementById('cap-code').value;
        var b2 = e.target.querySelector('button');
        b2.disabled = true;
        serveur()
          .withSuccessHandler(function (r) {
            codeEnvoye = false;
            modeMail = false;
            // Connecté grâce au mail : on propose tout de suite de choisir son code capitaine.
            connecterCapitaine(r.jeton, 'cap-code');
          })
          .withFailureHandler(function (err) { b2.disabled = false; afficherErreur(err && err.message ? err.message : 'Code refusé.'); })
          .validerCodeCapitaine(email2, code);
        return;
      }
      if (e.target.id === 'form-cap-perso') {
        e.preventDefault();
        var email3 = document.getElementById('cap-email').value.trim();
        var perso = document.getElementById('cap-perso').value;
        if (!email3) { afficherErreur('Tape ton adresse e-mail.'); return; }
        var b3 = e.target.querySelector('button');
        b3.disabled = true;
        capEmail = email3;
        serveur()
          .withSuccessHandler(function (r) { connecterCapitaine(r.jeton, 'cap'); })
          .withFailureHandler(function (err) {
            b3.disabled = false;
            var msg = err && err.message ? err.message : 'Connexion impossible.';
            if (/^PAS_DE_CODE: /.test(msg)) {
              // Pas (ou plus) de code capitaine : on bascule sur la connexion par mail.
              modeMail = true;
              messageCap = msg.replace(/^PAS_DE_CODE: /, '');
              rendre();
            } else {
              afficherErreur(msg);
            }
          })
          .connexionCodePerso(email3, perso);
        return;
      }
      if (e.target.id === 'form-code-perso') {
        e.preventDefault();
        var c1 = document.getElementById('code-perso-1').value, c2 = document.getElementById('code-perso-2').value;
        if (!/^\d{6}$/.test(c1)) { afficherErreur('Le code doit faire 6 chiffres.'); return; }
        if (c1 !== c2) { afficherErreur('Les deux codes ne sont pas pareils : retape-les.'); return; }
        var b4 = e.target.querySelector('button');
        b4.disabled = true;
        serveur()
          .withSuccessHandler(function () {
            messageCap = 'Code capitaine enregistré. La prochaine fois, tape ton adresse et ce code.';
            allerA('cap', true);
          })
          .withFailureHandler(function (err) {
            b4.disabled = false;
            var msg = err && err.message ? err.message : 'Enregistrement impossible.';
            if (/expirée/.test(msg)) deconnexionCap();
            afficherErreur(msg);
          })
          .definirCodePerso(jeton, c1);
        return;
      }
      if (e.target.id === 'form-renommer') {
        e.preventDefault();
        var ancien = renommage, saisi = document.getElementById('nouveau-nom').value;
        appelCap('renommerJoueur', [ancien, saisi], function (r) {
          messageCap = ancien + ' s\'appelle maintenant ' + r.nom + '.';
          if (moi === ancien) { moi = r.nom; ecrireNom(moi); }
          renommage = null;
        });
        return;
      }
      if (e.target.id === 'form-rencontre') {
        e.preventDefault();
        lireBrouillon();
        if (!brouillon.date) { afficherErreur('Choisis une date.'); return; }
        var r = Object.assign({}, brouillon);
        var etaitEdition = !!edition;
        appelCap('enregistrerRencontre', [r], function () {
          messageCap = (etaitEdition ? 'Rencontre modifiée : ' : 'Rencontre créée : ') + r.equipe + ' – ' + (r.adversaire || 'adversaire à venir') + ', ' + dateDansPhrase(r.date) + '.';
          edition = null;
          allerA(etaitEdition ? 'cap-gerer' : 'cap', true);
        });
        return;
      }
      if (e.target.id === 'form-resultat') {
        e.preventDefault();
        var parties = lireFormResultat();
        if (!parties.length) { afficherErreur('Remplis au moins une partie (ou touche « Effacer ce résultat »).'); return; }
        var illisible = parties.filter(function (p) { return !p.resultat && !issuePartie(p); })[0];
        if (illisible) { afficherErreur(illisible.partie + ' : score illisible ou égal. Écris-le comme « 6-3 4-6 7-6(5) » ou choisis Gagné / Perdu.'); return; }
        var pts = pointsRencontre({ parties: parties });
        enregistrerResultat(parties, 'Résultat enregistré : ' + pts.nous + '-' + pts.eux + '.');
        return;
      }
      if (e.target.id === 'form-ajout-joueur') {
        e.preventDefault();
        var nomAjout = nettoyerNom(document.getElementById('nom-ajout').value);
        if (cleNom(nomAjout).length < 2) { afficherErreur('Écris le prénom et l\'initiale du nom.'); return; }
        if (joueurParSaisie(nomAjout)) { afficherErreur(joueurParSaisie(nomAjout).nom + ' est déjà dans la liste.'); return; }
        var b5 = e.target.querySelector('button');
        b5.disabled = true;
        serveur()
          .withSuccessHandler(function (r) { donnees = r.donnees; messageCap = r.nom + ' a été ajouté à la liste des joueurs.'; rendre(); })
          .withFailureHandler(function (err) { b5.disabled = false; afficherErreur(err && err.message ? err.message : 'Ajout impossible.'); })
          .inscrire(nomAjout, donnees.groupes[0]);
        return;
      }
    });

    /** Garde le jeton capitaine sur le téléphone puis ouvre l'écran demandé. */
    function connecterCapitaine(nouveauJeton, ecran) {
      jeton = nouveauJeton;
      ecrireJeton(jeton);
      messageCap = '';
      serveur()
        .withSuccessHandler(function (info) { capitaine = info.email; allerA(ecran); })
        .withFailureHandler(function (err) { afficherErreur(err.message); })
        .infoCapitaine(jeton);
    }

    function connecter(nom) {
      moi = nom;
      ecrireNom(moi);
      choixMoi = '';
      allerA('accueil');
    }

    function charger() {
      serveur()
        .withSuccessHandler(function (d) {
          donnees = d;
          // Pas de rafraîchissement pendant une saisie (il effacerait les champs).
          if (!document.getElementById('form-rencontre') && !document.getElementById('form-resultat')) rendre();
        })
        .withFailureHandler(function (err) {
          document.getElementById('contenu').innerHTML =
            '<div class="vide">Impossible de charger les rencontres.<br>' + esc(err && err.message) +
            '<br><br><button onclick="location.reload()">Réessayer</button></div>';
        })
        .getDonnees();
    }

    /**
     * Nouvelle version de la page mise en ligne ? On recharge (sinon l'appli installée, restée ouverte
     * en mémoire, garde l'ancien code : seules les données se mettent à jour). Jamais pendant une saisie.
     */
    function verifierNouvelleVersion() {
      if (surAppsScript || !CODE_PAGE || !window.fetch) return;
      fetch(location.pathname, { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (html) {
          var m = /<script>([\s\S]*)<\/script>\s*<\/body>/.exec(html);
          if (!m || m[1] === CODE_PAGE) return;
          if (document.querySelector('#form-rencontre, #form-resultat') || Object.keys(enCours).length) return;
          try {
            // Au plus un rechargement par minute (au cas où la page servie changerait à chaque fois).
            if (Date.now() - (+sessionStorage.getItem('tcb-recharge') || 0) < 60000) return;
            sessionStorage.setItem('tcb-recharge', String(Date.now()));
          } catch (e) { return; }
          location.reload();
        })
        .catch(function () {});
    }

    // Rafraîchit quand on revient sur l'onglet du navigateur (réponses des autres, nouvelles dates).
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && donnees && !Object.keys(enCours).length) charger();
      if (!document.hidden) verifierNouvelleVersion();
    });

    charger();
    verifierCapitaine();
    verifierNouvelleVersion();
  </script>
</body>
</html>
