<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --fond: #f5f5f2;
      --carte: #ffffff;
      --texte: #1a1a1a;
      --doux: #5f5f5a;
      --ligne: #e2e2dc;
      --noir: #151515;
      --jaune: #f5c000;
      --jaune-fonce: #c99c00;
      --vert: #1f7a45;
      --vert-clair: #e2f3e8;
      --rouge: #c0392b;
      --rouge-clair: #fbe7e4;
      --orange: #a8640a;
      --orange-clair: #fdf1dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #121212;
        --carte: #1d1d1b;
        --texte: #ededea;
        --doux: #a8a8a2;
        --ligne: #34342f;
        --noir: #000000;
        --jaune-fonce: #f5c000;
        --vert: #4cc27c;
        --vert-clair: #183324;
        --rouge: #f07c6e;
        --rouge-clair: #3a1d19;
        --orange: #f0b45a;
        --orange-clair: #3a2a12;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      background: var(--noir);
      border-bottom: 4px solid var(--jaune);
      color: #fff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .titre { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    h1 { font-size: 19px; margin: 0; display: flex; align-items: center; gap: 10px; line-height: 1.2; }
    h1 .sous-titre { color: var(--jaune); }
    .logo { width: 48px; height: 48px; flex: none; border-radius: 50%; background: #fff; padding: 2px; }
    .droite { display: flex; align-items: center; gap: 10px; flex: none; }
    .moi { font-size: 15px; opacity: .9; }
    .bouton-cap {
      width: 42px; height: 42px; flex: none; border-radius: 50%; border: 2px solid var(--jaune);
      background: transparent; font-size: 20px; line-height: 1; cursor: pointer; padding: 0;
    }
    .moi button {
      background: none; border: 0; color: inherit; text-decoration: underline;
      font: inherit; padding: 4px 0; cursor: pointer;
    }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    .carte {
      background: var(--carte);
      border: 1px solid var(--ligne);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .jour { font-weight: 700; margin: 0 0 6px; border-left: 4px solid var(--jaune); padding-left: 8px; }
    .ligne-info { color: var(--doux); font-size: 15px; }
    .match { font-size: 18px; font-weight: 600; margin: 6px 0; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .badge {
      font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px;
      background: var(--fond); color: var(--doux);
    }
    .badge.validee { background: var(--vert-clair); color: var(--vert); }
    .badge.attente { background: var(--orange-clair); color: var(--orange); }
    .infos { background: var(--fond); border-radius: 8px; padding: 8px 10px; font-size: 15px; margin: 8px 0; }
    .boutons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 6px; }
    .boutons button {
      min-height: 56px; border-radius: 12px; font-weight: 700; font-size: 17px; font-family: inherit;
      border: 2px solid var(--ligne); background: var(--carte); color: var(--texte); cursor: pointer;
    }
    .boutons button.oui.choisi { background: var(--vert); border-color: var(--vert); color: #fff; }
    .boutons button.non.choisi { background: var(--rouge); border-color: var(--rouge); color: #fff; }
    .boutons button:disabled { opacity: .6; }
    .aide { font-size: 13px; color: var(--doux); text-align: center; }
    details { margin-top: 8px; font-size: 15px; }
    summary { cursor: pointer; color: var(--doux); padding: 4px 0; }
    .liste { margin: 4px 0 0; padding-left: 4px; }
    .liste b { display: inline-block; min-width: 130px; }
    .alerte {
      background: var(--rouge-clair); color: var(--rouge); font-weight: 600;
      border-radius: 10px; padding: 10px 12px; margin: 8px 0;
    }
    .rencontre { border-top: 1px solid var(--ligne); padding: 10px 0; }
    .jour + .rencontre, .alerte + .rencontre { border-top: 0; padding-top: 4px; }
    .rencontre .match { font-size: 16px; margin: 2px 0; }
    .compte { font-size: 14px; color: var(--doux); }
    .qui h2 { margin: 4px 0 4px; font-size: 22px; }
    .qui p { color: var(--doux); margin: 0 0 14px; }
    .qui label { display: block; font-weight: 600; margin-bottom: 8px; }
    .qui input {
      width: 100%; min-height: 54px; border-radius: 12px; border: 2px solid var(--ligne);
      background: var(--carte); color: var(--texte); font-size: 19px; font-family: inherit; padding: 0 14px;
    }
    .qui input:focus { outline: none; border-color: var(--jaune-fonce); }
    .gros {
      width: 100%; min-height: 56px; margin-top: 12px; border-radius: 12px; border: 0;
      background: var(--jaune); color: #151515; font-weight: 700; font-size: 18px; font-family: inherit; cursor: pointer;
    }
    .gros.second { background: var(--carte); color: var(--texte); border: 2px solid var(--ligne); }
    .gros:disabled { opacity: .6; }
    .lien { background: none; border: 0; color: var(--doux); text-decoration: underline; font: inherit; padding: 12px 0; cursor: pointer; }
    .vide, .chargement { text-align: center; color: var(--doux); padding: 40px 0; }
    .erreur {
      position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 3;
      background: var(--rouge); color: #fff; border-radius: 12px; padding: 12px 14px; font-weight: 600;
    }
    .pied { text-align: center; margin: 8px 0 24px; }
    .pied button, .lien {
      background: none; border: 0; color: var(--doux); text-decoration: underline; font: inherit; font-size: 15px; padding: 12px 0; cursor: pointer;
    }
    /* Espace capitaines */
    .cap h2 { margin: 4px 0 2px; font-size: 22px; }
    .cap .sous { color: var(--doux); margin: 0 0 16px; font-size: 15px; }
    .tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tuile {
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px;
      min-height: 120px; padding: 14px; text-align: left; cursor: pointer;
      background: var(--carte); color: var(--texte); border: 1px solid var(--ligne); border-left: 5px solid var(--jaune);
      border-radius: 14px; font-family: inherit;
    }
    .tuile .icone { font-size: 30px; line-height: 1; }
    .tuile b { font-size: 17px; }
    .tuile small { display: block; color: var(--doux); font-size: 13px; margin-top: 2px; font-weight: 400; }
    .tuile.noire { background: var(--noir); color: #fff; border-color: var(--noir); border-left-color: var(--jaune); }
    .tuile.noire small { color: #c9c9c4; }
    .champ { margin-bottom: 12px; }
    .champ label { display: block; font-weight: 600; margin-bottom: 6px; }
    .champ input, .champ select, .champ textarea {
      width: 100%; min-height: 50px; border-radius: 12px; border: 2px solid var(--ligne); padding: 0 12px;
      background: var(--carte); color: var(--texte); font-size: 17px; font-family: inherit;
    }
    .champ textarea { min-height: 80px; padding: 10px 12px; resize: vertical; }
    .champ input:focus, .champ select:focus, .champ textarea:focus { outline: none; border-color: var(--jaune-fonce); }
    .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choix { display: flex; gap: 8px; flex-wrap: wrap; }
    .choix button {
      flex: 1; min-height: 46px; border-radius: 12px; border: 2px solid var(--ligne); background: var(--carte);
      color: var(--texte); font-weight: 600; font-size: 15px; font-family: inherit; cursor: pointer; padding: 0 8px;
    }
    .choix button.choisi { border-color: var(--noir); background: var(--noir); color: var(--jaune); }
    @media (prefers-color-scheme: dark) { .choix button.choisi { border-color: var(--jaune); } }
    .ligne-cap { display: flex; gap: 8px; margin-top: 8px; }
    .ligne-cap button {
      flex: 1; min-height: 42px; border-radius: 10px; border: 2px solid var(--ligne); background: var(--carte);
      color: var(--texte); font-weight: 600; font-size: 15px; font-family: inherit; cursor: pointer;
    }
    .gros.danger { background: var(--carte); color: var(--rouge); border: 2px solid var(--rouge); }
    /* Tableau des dispos */
    .defile { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; }
    .grille { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 100%; }
    .grille th, .grille td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--ligne); white-space: nowrap; }
    .grille thead th { font-size: 12px; color: var(--doux); font-weight: 600; vertical-align: bottom; line-height: 1.25; }
    .grille thead th b { display: block; color: var(--texte); font-size: 13px; }
    .grille th.nom, .grille td.nom {
      position: sticky; left: 0; z-index: 1; text-align: left; background: var(--carte); font-weight: 600;
      border-right: 1px solid var(--ligne); max-width: 120px; overflow: hidden; text-overflow: ellipsis;
    }
    .grille td.oui { background: var(--vert-clair); }
    .grille td.non { background: var(--rouge-clair); }
    .grille td.vide { color: var(--doux); }
    .grille td.hors { color: var(--ligne); }
    .grille tfoot td { font-weight: 700; border-bottom: 0; }
    .grille tfoot td.total { color: var(--vert); }
    .filtres { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; -webkit-overflow-scrolling: touch; }
    .filtres button {
      flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--ligne);
      background: var(--carte); color: var(--texte); font-weight: 600; font-size: 14px; font-family: inherit; cursor: pointer;
    }
    .filtres.retour { flex-wrap: wrap; overflow-x: visible; }
    .filtres button.choisi { background: var(--noir); border-color: var(--noir); color: var(--jaune); }
    @media (prefers-color-scheme: dark) { .filtres button.choisi { border-color: var(--jaune); } }
    .legende { color: var(--doux); font-size: 13px; margin: 8px 2px 0; }
    /* Joueurs */
    .joueur { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid var(--ligne); }
    .joueur:first-child { border-top: 0; }
    .joueur .qui-j b { display: block; }
    .joueur .qui-j small { color: var(--doux); }
    .joueur .actions-j { display: flex; gap: 6px; flex: none; }
    .joueur .actions-j button {
      min-height: 38px; padding: 0 10px; border-radius: 10px; border: 2px solid var(--ligne); background: var(--carte);
      color: var(--texte); font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    .pastille { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-left: 4px; }
    .pastille.manque { background: var(--orange-clair); color: var(--orange); }
    .pastille.complet { background: var(--vert-clair); color: var(--vert); }
    .renommer { display: flex; gap: 6px; width: 100%; }
    .renommer input { flex: 1; min-height: 42px; border-radius: 10px; border: 2px solid var(--jaune-fonce); padding: 0 10px; font-size: 16px; font-family: inherit; background: var(--carte); color: var(--texte); }
    .renommer button { min-height: 42px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--jaune); color: #151515; font-weight: 700; font-family: inherit; cursor: pointer; }
    .renommer button.annuler { background: var(--carte); color: var(--texte); border: 2px solid var(--ligne); }
    .info { background: var(--vert-clair); color: var(--vert); border-radius: 10px; padding: 10px 12px; font-weight: 600; margin: 12px 0; }
    [hidden] { display: none !important; }
  </style>
</head>

    function lireNom() { try { return localStorage.getItem(CLE_NOM); } catch (e) { return null; } }
    function ecrireNom(nom) {
      try { nom ? localStorage.setItem(CLE_NOM, nom) : localStorage.removeItem(CLE_NOM); } catch (e) {}
    }
    var moi = lireNom();

    var CLE_CAPITAINE = 'tcb-championnat-capitaine';
    function lireJeton() { try { return localStorage.getItem(CLE_CAPITAINE) || ''; } catch (e) { return ''; } }
    function ecrireJeton(j) {
      try { j ? localStorage.setItem(CLE_CAPITAINE, j) : localStorage.removeItem(CLE_CAPITAINE); } catch (e) {}
    }
    // Lien de connexion reçu par mail : ?capitaine=<jeton>
    var jetonDuLien = '<?= jetonCapitaine ?>';
    if (jetonDuLien) {
      ecrireJeton(jetonDuLien);
      // Retire ?capitaine=… de la barre d'adresse : l'adresse copiée pour WhatsApp ne doit pas donner l'accès capitaine.
      try { google.script.history.replace(null, {}, ''); } catch (e) {}
    }
    var jeton = jetonDuLien || lireJeton();
    var capitaine = null;      // adresse du capitaine connecté
    var donneesCap = null;     // rencontres vues par les capitaines (avec nb de réponses)
    var edition = null;        // rencontre en cours de modification (null = création)
    var brouillon = null;      // valeurs du formulaire de rencontre
    var messageCap = '';
    var renommage = null;      // joueur en cours de renommage
    var filtreJour = '';       // journée affichée dans le tableau des dispos ('' = toutes)
    var filtreReponse = '';    // '' | 'Présent' | 'Absent' | 'aucune' : joueurs ayant au moins une case de ce type
    // 'matchs' | 'cap' (accueil) | 'cap-form' | 'cap-gerer' | 'cap-dispos'
    // La page s'ouvre toujours sur les matchs ; le lien reçu par mail connecte seulement le capitaine.
    var vue = 'matchs';

    // --- Outils ---
    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function dateLongue(iso) {
      var p = iso.split('-');
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      var texte = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      return texte.charAt(0).toUpperCase() + texte.slice(1);
    }
    function dateDansPhrase(iso) { return dateLongue(iso).toLowerCase(); }
    function compte(n, singulier, pluriel) {
      return n + ' ' + (n > 1 ? pluriel : singulier);
    }
    function joueur(nom) {
      return donnees.joueurs.filter(function (j) { return j.nom === nom; })[0];
    }
    function joueursEquipe(equipe) {
      return donnees.joueurs.filter(function (j) { return j.equipes.indexOf(equipe) !== -1; });
    }
    function reponseDe(id, nom) {
      return (donnees.reponses[id] || {})[nom] || '';
    }
    function bilan(r) {
      var presents = [], absents = [], sansReponse = [];
      joueursEquipe(r.equipe).forEach(function (j) {
        var rep = reponseDe(r.id, j.nom);
        (rep === 'Présent' ? presents : rep === 'Absent' ? absents : sansReponse).push(j.nom);
      });
      return { presents: presents, absents: absents, sansReponse: sansReponse };
    }
    /** Bandeau vert temporaire (même emplacement que les erreurs). */
    function afficherInfo(message) {
      afficherErreur(message);
      var el = document.getElementById('erreur');
      el.style.background = 'var(--vert)';
      clearTimeout(afficherInfo.t);
      afficherInfo.t = setTimeout(function () { el.style.background = ''; }, 5000);
    }
    function afficherErreur(message) {
      document.getElementById('erreur').style.background = '';
      var el = document.getElementById('erreur');
      el.textContent = message;
      el.hidden = false;
      clearTimeout(afficherErreur.t);
      afficherErreur.t = setTimeout(function () { el.hidden = true; }, 5000);
    }
    function badgeStatut(r) {
      return r.statut === 'Validée'
        ? '<span class="badge validee">✅ Date validée</span>'
        : '<span class="badge attente">⏳ En attente de convocation</span>';
    }
    function badgeLieu(r) {
      var texte = r.lieu === 'Domicile' ? '🏠 Domicile' : r.lieu === 'Extérieur' ? '🚗 Extérieur' : '📍 Lieu à venir';
      return '<span class="badge">' + texte + '</span>';
    }

    // --- Écrans ---
    function rendre() {
      var contenu = document.getElementById('contenu');
      var zoneMoi = document.getElementById('moi');

      if (!donnees) return;
      document.getElementById('bouton-cap').hidden = !capitaine || vue !== 'matchs';
      var champ = document.getElementById('champ-nom');
      if (champ && !inscription.choixGroupe) inscription.nom = champ.value;
      if (vue === 'cap-form') lireBrouillon();

      if (vue !== 'matchs') {
        zoneMoi.hidden = true;
        contenu.innerHTML = ecranCapitaine();
        return;
      }

      if (!moi || !joueur(moi)) {
        moi = null;
        zoneMoi.hidden = true;
        contenu.innerHTML = ecranQui();
        return;
      }

      zoneMoi.hidden = false;
      zoneMoi.innerHTML = esc(moi) + ' · <button id="changer">changer</button>';
      contenu.innerHTML = ecranListe();
    }

    /** Même clé que côté serveur : sans accents, majuscules, points ni espaces. */
    function cleNom(texte) {
      return String(texte).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');
    }
    /** « julien  c » → « Julien C » (même règle que côté serveur). */
    function nettoyerNom(texte) {
      return String(texte || '').trim().replace(/\s+/g, ' ').toLowerCase()
        .replace(/(^|[\s'-])(\p{L})/gu, function (m, sep, lettre) { return sep + lettre.toUpperCase(); });
    }
    function joueurParSaisie(texte) {
      var cle = cleNom(texte);
      return donnees.joueurs.filter(function (j) { return cleNom(j.nom) === cle; })[0];
    }

    function ecranQui() {
      var html = '<div class="qui"><h2>Qui es-tu ?</h2>';
      if (!inscription.choixGroupe) {
        return html + '<p>La première fois seulement : ton téléphone s\'en souviendra.</p>' +
          '<form id="form-nom"><label for="champ-nom">Ton prénom et l\'initiale de ton nom</label>' +
          '<input id="champ-nom" placeholder="ex. Julien C." autocomplete="name" autocapitalize="words" maxlength="40" value="' +
            esc(inscription.nom) + '">' +
          '<button class="gros" type="submit">Continuer</button></form></div>' + piedCapitaines();
      }
      html += '<p>Bienvenue <b>' + esc(inscription.nom) + '</b> ! Tu joues dans quelle équipe ?</p>';
      donnees.groupes.forEach(function (g) {
        html += '<button class="gros second" data-groupe="' + esc(g) + '"' +
          (inscription.envoi ? ' disabled' : '') + '>' + esc(g) + '</button>';
      });
      return html + '<button class="lien" id="corriger-nom">← Corriger mon nom</button></div>';
    }

    function piedCapitaines() {
      return '<p class="pied"><button data-vue="cap">⚙️ Espace capitaines</button></p>';
    }

    /** Tous les matchs du club, par date ; chacun peut répondre sur chaque match. */
    function ecranListe() {
      var pied = piedCapitaines();
      if (!donnees.rencontres.length) return '<div class="vide">Aucune rencontre à venir.</div>' + pied;
      return parJour(donnees.rencontres).map(function (j) {
        var domicile = j.rencontres.filter(function (r) { return r.lieu === 'Domicile'; }).length;
        var html = '<div class="carte"><p class="jour">' + esc(dateLongue(j.date)) + '</p>';
        if (domicile > donnees.maxDomicileParJour) {
          html += '<div class="alerte">⚠️ ' + domicile + ' rencontres à domicile ce jour-là, pour ' +
            donnees.nbTerrains + ' terrains.</div>';
        }
        return html + j.rencontres.map(carteRencontre).join('') + '</div>';
      }).join('') + pied;
    }

    function parJour(rencontres) {
      var jours = [], index = {};
      rencontres.forEach(function (r) {
        if (!(r.date in index)) { index[r.date] = jours.length; jours.push({ date: r.date, rencontres: [] }); }
        jours[index[r.date]].rencontres.push(r);
      });
      return jours;
    }

    function carteRencontre(r) {
      var rep = reponseDe(r.id, moi);
      var b = bilan(r);
      var occupe = enCours[r.id] ? ' disabled' : '';
      return '<div class="rencontre">' +
        '<div class="match">' + esc(r.equipe) + ' – ' + esc(r.adversaire || 'Adversaire à venir') + '</div>' +
        '<div class="ligne-info">' + esc(r.heure || 'Heure à venir') + '</div>' +
        '<div class="badges">' + badgeStatut(r) + badgeLieu(r) + '</div>' +
        (r.infos ? '<div class="infos">' + esc(r.infos) + '</div>' : '') +
        '<div class="boutons">' +
          '<button class="oui' + (rep === 'Présent' ? ' choisi' : '') + '" data-id="' + esc(r.id) + '" data-rep="Présent"' + occupe + '>' +
            (rep === 'Présent' ? '✅ ' : '') + 'Je suis dispo</button>' +
          '<button class="non' + (rep === 'Absent' ? ' choisi' : '') + '" data-id="' + esc(r.id) + '" data-rep="Absent"' + occupe + '>' +
            (rep === 'Absent' ? '❌ ' : '') + 'Pas dispo</button>' +
        '</div>' +
        (rep ? '<div class="aide">Touche à nouveau pour annuler ta réponse.</div>' : '') +
        '<details><summary>' + compte(b.presents.length, 'dispo', 'dispos') + ' · ' +
          compte(b.absents.length, 'pas dispo', 'pas dispos') + ' · ' + b.sansReponse.length + ' sans réponse</summary><div class="liste">' +
          ligneNoms('✅ Dispos', b.presents) +
          ligneNoms('❌ Pas dispos', b.absents) +
          ligneNoms('… Pas répondu', b.sansReponse) +
        '</div></details>' +
        '</div>';
    }

    function ligneNoms(titre, noms) {
      return '<div><b>' + titre + '</b> ' + (noms.length ? esc(noms.join(', ')) : '–') + '</div>';
    }

    function repondre(id, rep) {
      var ancienne = reponseDe(id, moi);
      var nouvelle = ancienne === rep ? '' : rep; // toucher à nouveau = annuler

      // Affichage immédiat, corrigé si le serveur refuse.
      donnees.reponses[id] = donnees.reponses[id] || {};
      if (nouvelle) donnees.reponses[id][moi] = nouvelle; else delete donnees.reponses[id][moi];
      enCours[id] = true;
      rendre();

      google.script.run
        .withSuccessHandler(function (reponses) {
          delete enCours[id];
          donnees.reponses = reponses;
          rendre();
        })
        .withFailureHandler(function (err) {
          delete enCours[id];
          if (ancienne) donnees.reponses[id][moi] = ancienne; else delete donnees.reponses[id][moi];
          rendre();
          afficherErreur('Réponse non enregistrée : ' + (err && err.message ? err.message : 'problème de connexion') + '. Réessaie.');
        })
        .repondre([id], moi, nouvelle);
    }

    // ======================= Espace capitaines =======================

    function ecranCapitaine() {
      if (!capitaine) return jeton ? '<div class="vide">Connexion…</div>' : ecranConnexionCap();
      if (vue === 'cap-form') return ecranFormRencontre();
      if (vue === 'cap-gerer') return ecranGerer();
      if (vue === 'cap-dispos') return ecranDispos();
      if (vue === 'cap-tableau') return ecranTableau();
      if (vue === 'cap-joueurs') return ecranJoueurs();
      var nbAttente = donnees.rencontres.filter(function (r) { return r.statut !== 'Validée'; }).length;
      return '<div class="cap"><h2>⚙️ Espace capitaines</h2><p class="sous">Connecté : ' + esc(capitaine) + '</p>' +
        (messageCap ? '<div class="info">' + esc(messageCap) + '</div>' : '') +
        '<div class="tuiles">' +
          tuile('cap-form', '➕', 'Créer une rencontre', 'Date, adversaire, lieu…', true) +
          tuile('cap-gerer', '📅', 'Gérer les rencontres', 'Modifier, valider, supprimer' + (nbAttente ? ' · ' + nbAttente + ' en attente' : '')) +
          tuile('cap-tableau', '📊', 'Tableau des dispos', 'Vue globale joueurs × matchs') +
          tuile('cap-dispos', '👥', 'Dispos par match', 'Qui vient à chaque match') +
          tuile('cap-joueurs', '👤', 'Joueurs', sansReponseTotal() ? sansReponseTotal() + ' sans réponse à tout' : 'Renommer, supprimer') +
          tuile('matchs', '🎾', 'Page des joueurs', 'Revenir aux matchs') +
        '</div>' +
        '<p class="pied"><button id="deconnexion-cap">Se déconnecter de l\'espace capitaines</button></p></div>';
    }

    function tuile(cible, icone, titre, detail, noire) {
      return '<button class="tuile' + (noire ? ' noire' : '') + '" data-vue="' + cible + '">' +
        '<span class="icone">' + icone + '</span><span><b>' + esc(titre) + '</b><small>' + esc(detail) + '</small></span></button>';
    }

    function enTeteCap(titre) {
      return '<div class="cap"><button class="lien" data-vue="cap">← Espace capitaines</button><h2>' + esc(titre) + '</h2>' +
        (messageCap ? '<div class="info">' + esc(messageCap) + '</div>' : '');
    }

    function ecranConnexionCap() {
      return '<div class="cap"><button class="lien" data-vue="matchs">← Retour aux matchs</button>' +
        '<h2>⚙️ Espace capitaines</h2>' +
        '<p class="sous">Réservé aux capitaines. Tape ton adresse : tu recevras un lien de connexion par mail. ' +
        'Ton téléphone s\'en souviendra ensuite.</p>' +
        (messageCap ? '<div class="info">' + esc(messageCap) + '</div>' : '') +
        '<form id="form-cap-connexion"><div class="champ"><label for="cap-email">Ton adresse e-mail</label>' +
        '<input id="cap-email" type="email" autocomplete="email" placeholder="prenom.nom@gmail.com" required></div>' +
        '<button class="gros" type="submit">Recevoir mon lien de connexion</button></form></div>';
    }

    function ecranFormRencontre() {
      var b = brouillon;
      var html = enTeteCap(edition ? 'Modifier la rencontre' : 'Créer une rencontre') +
        '<form id="form-rencontre">' +
        '<div class="deux"><div class="champ"><label for="r-date">Date</label><input id="r-date" type="date" required value="' + esc(b.date) + '"></div>' +
        '<div class="champ"><label for="r-heure">Heure</label><input id="r-heure" placeholder="9h, 14h30" value="' + esc(b.heure) + '"></div></div>' +
        '<div class="champ"><label>Équipe</label><div class="choix">' + boutonsChoix('equipe', donnees.equipes, b.equipe) + '</div></div>' +
        '<div class="champ"><label for="r-adversaire">Adversaire</label><input id="r-adversaire" placeholder="ex. TC Montaigu 4" value="' + esc(b.adversaire) + '"></div>' +
        '<div class="champ"><label>Lieu</label><div class="choix">' +
          boutonsChoix('lieu', ['Domicile', 'Extérieur', ''], b.lieu, { '': 'À venir', 'Domicile': '🏠 Domicile', 'Extérieur': '🚗 Extérieur' }) + '</div></div>' +
        '<div class="champ"><label>Statut</label><div class="choix">' +
          boutonsChoix('statut', ['En attente', 'Validée'], b.statut, { 'En attente': '⏳ En attente', 'Validée': '✅ Validée' }) + '</div></div>' +
        '<div class="champ"><label for="r-infos">Infos pour les joueurs</label><textarea id="r-infos" placeholder="ex. RDV 8h30 au club">' + esc(b.infos) + '</textarea></div>' +
        '<button class="gros" type="submit">' + (edition ? 'Enregistrer les modifications' : 'Créer la rencontre') + '</button>';
      if (edition) html += '<button class="gros danger" type="button" id="supprimer-rencontre">Supprimer cette rencontre</button>';
      return html + '</form></div>';
    }

    function boutonsChoix(champ, valeurs, actuelle, libelles) {
      return valeurs.map(function (v) {
        return '<button type="button" data-champ="' + champ + '" data-valeur="' + esc(v) + '"' + (v === actuelle ? ' class="choisi"' : '') + '>' +
          esc(libelles && libelles[v] != null ? libelles[v] : v) + '</button>';
      }).join('');
    }

    function lireBrouillon() {
      if (!document.getElementById('form-rencontre')) return;
      brouillon.date = document.getElementById('r-date').value;
      brouillon.heure = document.getElementById('r-heure').value;
      brouillon.adversaire = document.getElementById('r-adversaire').value;
      brouillon.infos = document.getElementById('r-infos').value;
    }

    function ouvrirForm(r) {
      edition = r || null;
      brouillon = r
        ? { id: r.id, date: r.date, heure: r.heure, equipe: r.equipe, adversaire: r.adversaire, lieu: r.lieu, statut: r.statut, infos: r.infos }
        : { id: '', date: '', heure: '', equipe: donnees.equipes[0], adversaire: '', lieu: '', statut: 'En attente', infos: '' };
      allerA('cap-form');
    }

    function ecranGerer() {
      var html = enTeteCap('Gérer les rencontres');
      if (!donnees.rencontres.length) return html + '<div class="vide">Aucune rencontre à venir.</div></div>';
      html += parJour(donnees.rencontres).map(function (j) {
        return '<div class="carte"><p class="jour">' + esc(dateLongue(j.date)) + '</p>' + j.rencontres.map(function (r) {
          var nb = Object.keys(donnees.reponses[r.id] || {}).length;
          return '<div class="rencontre"><div class="match">' + esc(r.equipe) + ' – ' + esc(r.adversaire || 'Adversaire à venir') + '</div>' +
            '<div class="ligne-info">' + esc(r.heure || 'Heure à venir') + ' · ' + nb + ' réponse' + (nb > 1 ? 's' : '') + '</div>' +
            '<div class="badges">' + badgeStatut(r) + badgeLieu(r) + '</div>' +
            '<div class="ligne-cap"><button data-modifier="' + esc(r.id) + '">✏️ Modifier</button>' +
            '<button data-basculer="' + esc(r.id) + '">' + (r.statut === 'Validée' ? '⏳ Remettre en attente' : '✅ Valider') + '</button></div></div>';
        }).join('') + '</div>';
      }).join('');
      return html + '</div>';
    }

    function ecranDispos() {
      var html = enTeteCap('Dispos des joueurs');
      if (!donnees.rencontres.length) return html + '<div class="vide">Aucune rencontre à venir.</div></div>';
      html += parJour(donnees.rencontres).map(function (j) {
        return '<div class="carte"><p class="jour">' + esc(dateLongue(j.date)) + '</p>' + j.rencontres.map(function (r) {
          var b = bilan(r);
          return '<div class="rencontre"><div class="match">' + esc(r.equipe) + ' – ' + esc(r.adversaire || 'Adversaire à venir') + '</div>' +
            '<div class="liste">' + ligneNoms('✅ ' + b.presents.length + ' dispo' + (b.presents.length > 1 ? 's' : ''), b.presents) +
            ligneNoms('❌ ' + b.absents.length + ' pas dispo' + (b.absents.length > 1 ? 's' : ''), b.absents) +
            ligneNoms('… ' + b.sansReponse.length + ' sans réponse', b.sansReponse) + '</div></div>';
        }).join('') + '</div>';
      }).join('');
      return html + '</div>';
    }

    /** Rencontres à venir qui concernent un joueur (ses équipes). */
    function matchsDe(j) {
      return donnees.rencontres.filter(function (r) { return j.equipes.indexOf(r.equipe) !== -1; });
    }
    function nbReponsesDe(j) {
      return matchsDe(j).filter(function (r) { return reponseDe(r.id, j.nom); }).length;
    }
    /** Nombre de joueurs qui n'ont répondu à aucun de leurs matchs. */
    function sansReponseTotal() {
      return donnees.joueurs.filter(function (j) { return matchsDe(j).length && !nbReponsesDe(j); }).length;
    }
    function dateCourte(iso) {
      var p = iso.split('-');
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }).replace('.', '');
    }
    function abregeEquipe(e) { return e.replace('Hommes ', 'H'); }

    function ecranTableau() {
      var html = enTeteCap('Tableau des dispos');
      if (!donnees.rencontres.length || !donnees.joueurs.length) return html + '<div class="vide">Pas encore de rencontres ou de joueurs.</div></div>';
      var jours = parJour(donnees.rencontres).map(function (j) { return j.date; });
      if (jours.indexOf(filtreJour) === -1) filtreJour = '';
      html += '<div class="filtres"><button data-filtre-jour=""' + (filtreJour ? '' : ' class="choisi"') + '>Toutes</button>' +
        jours.map(function (d) {
          return '<button data-filtre-jour="' + d + '"' + (d === filtreJour ? ' class="choisi"' : '') + '>' + esc(dateCourte(d)) + '</button>';
        }).join('') + '</div>';
      var rs = donnees.rencontres.filter(function (r) { return !filtreJour || r.date === filtreJour; });
      // Sur une journée : dispos d'abord, puis sans réponse, puis pas dispos (pratique pour la sélection).
      var rang = function (j) {
        var reps = rs.filter(function (r) { return j.equipes.indexOf(r.equipe) !== -1; }).map(function (r) { return reponseDe(r.id, j.nom); });
        return reps.indexOf('Présent') !== -1 ? 0 : reps.indexOf('Absent') !== -1 && reps.every(Boolean) ? 2 : 1;
      };
      var joueurs = filtreJour
        ? donnees.joueurs.slice().sort(function (a, b) { return rang(a) - rang(b) || a.nom.localeCompare(b.nom, 'fr'); })
        : donnees.joueurs;

      // Filtre par réponse : garde les joueurs qui ont au moins une case de ce type parmi les matchs affichés.
      var aCase = function (j, type) {
        return rs.some(function (r) {
          if (j.equipes.indexOf(r.equipe) === -1) return false;
          var rep = reponseDe(r.id, j.nom);
          return type === 'aucune' ? !rep : rep === type;
        });
      };
      var types = [['', 'Tous'], ['Présent', '✅ Dispo'], ['Absent', '❌ Pas dispo'], ['aucune', '– Non voté']];
      html += '<div class="filtres retour">' + types.map(function (t) {
        var nb = t[0] ? joueurs.filter(function (j) { return aCase(j, t[0]); }).length : joueurs.length;
        return '<button data-filtre-reponse="' + t[0] + '"' + (t[0] === filtreReponse ? ' class="choisi"' : '') + '>' +
          t[1] + ' (' + nb + ')</button>';
      }).join('') + '</div>';
      if (filtreReponse) joueurs = joueurs.filter(function (j) { return aCase(j, filtreReponse); });
      if (!joueurs.length) return html + '<div class="vide">Aucun joueur pour ce filtre.</div></div>';
      html += '<div class="defile"><table class="grille"><thead><tr><th class="nom">Joueur</th>' +
        rs.map(function (r) {
          return '<th><b>' + esc(dateCourte(r.date)) + '</b>' + esc(abregeEquipe(r.equipe)) + ' ' + (r.lieu === 'Domicile' ? '🏠' : r.lieu === 'Extérieur' ? '🚗' : '') + '</th>';
        }).join('') + '<th>Répondu</th></tr></thead><tbody>';
      joueurs.forEach(function (j) {
        var n = 0, total = 0;
        html += '<tr><td class="nom">' + esc(j.nom) + '</td>' + rs.map(function (r) {
          if (j.equipes.indexOf(r.equipe) === -1) return '<td class="hors">·</td>';
          total++;
          var rep = reponseDe(r.id, j.nom);
          if (rep) n++;
          return rep === 'Présent' ? '<td class="oui">✅</td>' : rep === 'Absent' ? '<td class="non">❌</td>' : '<td class="vide">–</td>';
        }).join('') + '<td>' + n + '/' + total + '</td></tr>';
      });
      html += '</tbody><tfoot><tr><td class="nom">Dispos</td>' + rs.map(function (r) {
        return '<td class="total">' + bilan(r).presents.length + '</td>';
      }).join('') + '<td></td></tr></tfoot></table></div>' +
        '<p class="legende">✅ dispo · ❌ pas dispo · – pas encore répondu.' +
        (filtreJour ? ' Joueurs triés : dispos d\'abord.' : ' Fais glisser le tableau vers la gauche pour voir tous les matchs.') + '</p>';
      return html + '</div>';
    }

    function ecranJoueurs() {
      var html = enTeteCap('Joueurs');
      if (!donnees.joueurs.length) return html + '<div class="vide">Aucun joueur inscrit pour le moment.</div></div>';
      // Ceux à qui il manque le plus de réponses d'abord.
      var liste = donnees.joueurs.map(function (j) {
        return { j: j, total: matchsDe(j).length, n: nbReponsesDe(j) };
      }).sort(function (a, b) { return (b.total - b.n) - (a.total - a.n) || a.j.nom.localeCompare(b.j.nom, 'fr'); });
      var silencieux = liste.filter(function (x) { return x.total && !x.n; }).map(function (x) { return x.j.nom; });
      html += '<p class="sous">' + donnees.joueurs.length + ' joueur' + (donnees.joueurs.length > 1 ? 's' : '') + ' inscrit' +
        (donnees.joueurs.length > 1 ? 's' : '') + '.' + (silencieux.length ? ' Pas encore répondu du tout : <b>' + esc(silencieux.join(', ')) + '</b>.' : '') + '</p>';
      html += '<div class="carte">' + liste.map(function (x) {
        var j = x.j, manque = x.total - x.n;
        if (renommage === j.nom) {
          return '<div class="joueur"><form class="renommer" id="form-renommer"><input id="nouveau-nom" value="' + esc(j.nom) + '" maxlength="40">' +
            '<button type="submit">OK</button><button type="button" class="annuler" id="annuler-renommage">✕</button></form></div>';
        }
        return '<div class="joueur"><div class="qui-j"><b>' + esc(j.nom) + '</b><small>' + x.n + '/' + x.total + ' réponses' +
          (manque ? '<span class="pastille manque">' + manque + ' sans réponse</span>' : (x.total ? '<span class="pastille complet">à jour</span>' : '')) +
          '</small></div><div class="actions-j"><button data-renommer="' + esc(j.nom) + '">✏️</button>' +
          '<button data-supprimer-joueur="' + esc(j.nom) + '">🗑</button></div></div>';
      }).join('') + '</div>';
      return html + '</div>';
    }

    function allerA(nouvelleVue) {
      renommage = null;
      if (nouvelleVue !== vue) messageCap = '';
      vue = nouvelleVue;
      rendre();
      window.scrollTo(0, 0);
    }

    function appelCap(fonction, args, succes) {
      var boutons = document.querySelectorAll('#contenu button');
      Array.prototype.forEach.call(boutons, function (b) { b.disabled = true; });
      var run = google.script.run
        .withSuccessHandler(function (r) {
          donneesCap = r;
          succes(r);
          charger(); // met à jour la page des joueurs avec la Sheet
        })
        .withFailureHandler(function (err) {
          Array.prototype.forEach.call(boutons, function (b) { b.disabled = false; });
          var msg = err && err.message ? err.message : 'problème de connexion';
          if (/expirée/.test(msg)) { deconnexionCap(); }
          afficherErreur(msg);
        });
      run[fonction].apply(run, [jeton].concat(args));
    }

    function verifierCapitaine() {
      if (!jeton) return;
      google.script.run
        .withSuccessHandler(function (info) {
          capitaine = info.email;
          if (jetonDuLien) afficherInfo('Connecté comme capitaine (' + capitaine + '). L\'espace capitaines est sous ⚙️ en haut à droite.');
          rendre();
        })
        .withFailureHandler(function () {
          deconnexionCap();
          if (vue !== 'matchs') { messageCap = 'Ce lien n\'est plus valable : redemande un lien de connexion.'; rendre(); }
        })
        .infoCapitaine(jeton);
    }

    function deconnexionCap() {
      capitaine = null;
      jeton = '';
      ecrireJeton('');
    }

    document.addEventListener('click', function (e) {
      var cible = e.target.closest('button');
      if (!cible) return;
      if (cible.hasAttribute('data-vue')) {
        var v = cible.getAttribute('data-vue');
        if (v === 'cap-form') ouvrirForm(null); else allerA(v);
      } else if (cible.hasAttribute('data-champ')) {
        lireBrouillon();
        brouillon[cible.getAttribute('data-champ')] = cible.getAttribute('data-valeur');
        rendre();
      } else if (cible.hasAttribute('data-modifier')) {
        ouvrirForm(donnees.rencontres.filter(function (r) { return r.id === cible.getAttribute('data-modifier'); })[0]);
      } else if (cible.hasAttribute('data-basculer')) {
        var r = donnees.rencontres.filter(function (x) { return x.id === cible.getAttribute('data-basculer'); })[0];
        var modif = Object.assign({}, r, { statut: r.statut === 'Validée' ? 'En attente' : 'Validée' });
        appelCap('enregistrerRencontre', [modif], function () {
          messageCap = modif.equipe + ' du ' + dateDansPhrase(modif.date) + (modif.statut === 'Validée' ? ' : date validée.' : ' : remise en attente.');
        });
      } else if (cible.id === 'supprimer-rencontre') {
        if (!confirm('Supprimer ' + edition.equipe + ' – ' + (edition.adversaire || 'adversaire à venir') + ' du ' + dateDansPhrase(edition.date) +
          ' ? Les réponses des joueurs à ce match seront aussi supprimées.')) return;
        var supprimee = edition;
        appelCap('supprimerRencontre', [supprimee.id], function () {
          messageCap = 'Rencontre du ' + dateDansPhrase(supprimee.date) + ' supprimée.';
          vue = 'cap-gerer';
        });
      } else if (cible.hasAttribute('data-filtre-reponse')) {
        filtreReponse = cible.getAttribute('data-filtre-reponse');
        rendre();
      } else if (cible.hasAttribute('data-filtre-jour')) {
        filtreJour = cible.getAttribute('data-filtre-jour');
        rendre();
      } else if (cible.hasAttribute('data-renommer')) {
        renommage = cible.getAttribute('data-renommer');
        rendre();
        var champNom = document.getElementById('nouveau-nom');
        if (champNom) { champNom.focus(); champNom.select(); }
      } else if (cible.id === 'annuler-renommage') {
        renommage = null;
        rendre();
      } else if (cible.hasAttribute('data-supprimer-joueur')) {
        var nomSuppr = cible.getAttribute('data-supprimer-joueur');
        if (!confirm('Supprimer ' + nomSuppr + ' et toutes ses réponses ?')) return;
        appelCap('supprimerJoueur', [nomSuppr], function () {
          messageCap = nomSuppr + ' a été supprimé.';
          if (moi === nomSuppr) { moi = null; ecrireNom(null); }
        });
      } else if (cible.id === 'deconnexion-cap') {
        google.script.run.deconnecterCapitaine(jeton);
        deconnexionCap();
        allerA('matchs');
      } else if (cible.hasAttribute('data-groupe')) {
        inscrire(cible.getAttribute('data-groupe'));
      } else if (cible.id === 'corriger-nom') {
        inscription.choixGroupe = false;
        rendre();
      } else if (cible.id === 'changer') {
        moi = null;
        ecrireNom(null);
        inscription = { nom: '', choixGroupe: false, envoi: false };
        rendre();
      } else if (cible.hasAttribute('data-rep')) {
        repondre(cible.getAttribute('data-id'), cible.getAttribute('data-rep'));
      }
    });

    document.addEventListener('submit', function (e) {
      if (e.target.id === 'form-cap-connexion') {
        e.preventDefault();
        var email = document.getElementById('cap-email').value.trim();
        var bouton = e.target.querySelector('button');
        bouton.disabled = true;
        google.script.run
          .withSuccessHandler(function (msg) { messageCap = msg; rendre(); })
          .withFailureHandler(function (err) { bouton.disabled = false; afficherErreur(err && err.message ? err.message : 'Envoi impossible.'); })
          .demanderLienCapitaine(email);
        return;
      }
      if (e.target.id === 'form-renommer') {
        e.preventDefault();
        var ancien = renommage, saisi = document.getElementById('nouveau-nom').value;
        appelCap('renommerJoueur', [ancien, saisi], function (r) {
          messageCap = ancien + ' s\'appelle maintenant ' + r.nom + '.';
          if (moi === ancien) { moi = r.nom; ecrireNom(moi); }
          renommage = null;
        });
        return;
      }
      if (e.target.id === 'form-rencontre') {
        e.preventDefault();
        lireBrouillon();
        if (!brouillon.date) { afficherErreur('Choisis une date.'); return; }
        var r = Object.assign({}, brouillon);
        var etaitEdition = !!edition;
        appelCap('enregistrerRencontre', [r], function () {
          messageCap = (etaitEdition ? 'Rencontre modifiée : ' : 'Rencontre créée : ') + r.equipe + ' – ' + (r.adversaire || 'adversaire à venir') + ', ' + dateDansPhrase(r.date) + '.';
          edition = null;
          vue = etaitEdition ? 'cap-gerer' : 'cap';
        });
        return;
      }
      if (e.target.id !== 'form-nom') return;
      e.preventDefault();
      var saisie = nettoyerNom(document.getElementById('champ-nom').value);
      if (cleNom(saisie).length < 2) { afficherErreur('Écris ton prénom et l\'initiale de ton nom.'); return; }
      inscription.nom = saisie;
      var existant = joueurParSaisie(saisie);
      if (existant) connecter(existant.nom);
      else if (donnees.groupes.length === 1) inscrire(donnees.groupes[0]); // une seule équipe : pas de question
      else { inscription.choixGroupe = true; rendre(); }
    });

    function connecter(nom) {
      moi = nom;
      ecrireNom(moi);
      inscription = { nom: '', choixGroupe: false, envoi: false };
      rendre();
      window.scrollTo(0, 0);
    }

    function inscrire(groupe) {
      inscription.envoi = true;
      rendre();
      google.script.run
        .withSuccessHandler(function (r) { donnees = r.donnees; connecter(r.nom); })
        .withFailureHandler(function (err) {
          inscription.envoi = false;
          rendre();
          afficherErreur('Inscription impossible : ' + (err && err.message ? err.message : 'problème de connexion') + '.');
        })
        .inscrire(inscription.nom, groupe);
    }

    function charger() {
      google.script.run
        .withSuccessHandler(function (d) {
          donnees = d;
          if (vue !== 'cap-form' || !document.getElementById('form-rencontre')) rendre();
        })
        .withFailureHandler(function (err) {
          document.getElementById('contenu').innerHTML =
            '<div class="vide">Impossible de charger les rencontres.<br>' + esc(err && err.message) +
            '<br><br><button onclick="location.reload()">Réessayer</button></div>';
        })
        .getDonnees();
    }

    // Rafraîchit quand on revient sur l'onglet du navigateur (réponses des autres, nouvelles dates).
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && donnees && !Object.keys(enCours).length) charger();
    });

    charger();
    verifierCapitaine();
  </script>
</body>
</html>
