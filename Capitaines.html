<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --texte: #1d2a22;
      --doux: #5d6b62;
      --ligne: #dde3dd;
      --fond: #f4f6f3;
      --vert: #1f7a45;
      --vert-clair: #e2f3e8;
      --orange: #a8640a;
      --orange-clair: #fdf1dc;
      --rouge: #c0392b;
      --noir: #151515;
      --jaune: #f5c000;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; color: var(--texte); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    button { font: inherit; cursor: pointer; border-radius: 8px; }
    .principal { background: var(--noir); color: var(--jaune); border: 0; padding: 9px 12px; font-weight: 600; }
    .second { background: #fff; color: var(--texte); border: 1px solid var(--ligne); padding: 8px 10px; }
    .danger { background: #fff; color: var(--rouge); border: 1px solid var(--rouge); padding: 8px 10px; }
    .petit { background: none; border: 1px solid var(--ligne); padding: 3px 8px; font-size: 12px; }
    button:disabled { opacity: .5; cursor: default; }
    .plein { width: 100%; }
    .jour { font-weight: 700; margin: 16px 0 6px; border-left: 4px solid var(--jaune); padding-left: 6px; }
    .rencontre { border: 1px solid var(--ligne); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
    .titre { font-weight: 600; }
    .details { color: var(--doux); font-size: 12px; margin: 2px 0 6px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; }
    .validee { background: var(--vert-clair); color: var(--vert); }
    .attente { background: var(--orange-clair); color: var(--orange); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; font: inherit; padding: 7px 8px; border: 1px solid var(--ligne); border-radius: 8px; background: #fff; color: var(--texte);
    }
    textarea { min-height: 60px; resize: vertical; }
    .boutons-form { display: flex; gap: 8px; margin-top: 14px; }
    .boutons-form button { flex: 1; }
    .message { margin: 10px 0; padding: 8px 10px; border-radius: 8px; font-weight: 600; }
    .message.ok { background: var(--vert-clair); color: var(--vert); }
    .message.erreur { background: #fbe7e4; color: var(--rouge); }
    .vide { color: var(--doux); text-align: center; padding: 20px 0; }
    .aide { color: var(--doux); font-size: 12px; margin-top: 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="message" class="message" hidden></div>

  <section id="vue-liste">
    <button class="principal plein" id="ajouter">+ Ajouter une rencontre</button>
    <div id="liste"><div class="vide">Chargement…</div></div>
  </section>

  <section id="vue-form" hidden>
    <h2 id="titre-form">Nouvelle rencontre</h2>
    <form id="form">
      <label for="f-date">Date</label>
      <input type="date" id="f-date" required>
      <label for="f-heure">Heure</label>
      <input id="f-heure" placeholder="ex. 9h ou 14h30">
      <label for="f-equipe">Équipe</label>
      <select id="f-equipe"></select>
      <label for="f-adversaire">Adversaire</label>
      <input id="f-adversaire" placeholder="ex. TC Montaigu 4">
      <label for="f-lieu">Lieu</label>
      <select id="f-lieu"></select>
      <label for="f-statut">Statut</label>
      <select id="f-statut"></select>
      <label for="f-infos">Infos pour les joueurs</label>
      <textarea id="f-infos" placeholder="ex. RDV 8h30 au club"></textarea>
      <div class="boutons-form">
        <button type="button" class="second" id="annuler">Annuler</button>
        <button type="submit" class="principal" id="enregistrer">Enregistrer</button>
      </div>
      <button type="button" class="danger plein" id="supprimer" style="margin-top:10px" hidden>Supprimer cette rencontre</button>
      <div class="aide" id="aide-suppr" hidden></div>
    </form>
  </section>

  <script>
    var donnees = null;
    var edition = null; // rencontre en cours de modification, ou null pour un ajout

    function $(id) { return document.getElementById(id); }
    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function dateLongue(iso) {
      var p = iso.split('-');
      var texte = new Date(+p[0], +p[1] - 1, +p[2])
        .toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      return texte.charAt(0).toUpperCase() + texte.slice(1);
    }
    function message(texte, type) {
      var el = $('message');
      el.textContent = texte;
      el.className = 'message ' + type;
      el.hidden = false;
      clearTimeout(message.t);
      message.t = setTimeout(function () { el.hidden = true; }, 4000);
    }
    function options(select, valeurs, vide) {
      select.innerHTML = (vide ? '<option value="">' + esc(vide) + '</option>' : '') +
        valeurs.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join('');
    }
    function appeler(fonction, args, ok) {
      Array.prototype.forEach.call(document.querySelectorAll('button'), function (b) { b.disabled = true; });
      var run = google.script.run
        .withSuccessHandler(function (d) { donnees = d; activer(); ok && ok(); })
        .withFailureHandler(function (err) { activer(); message(err && err.message ? err.message : 'Erreur.', 'erreur'); });
      run[fonction].apply(run, args || []);
    }
    function activer() {
      Array.prototype.forEach.call(document.querySelectorAll('button'), function (b) { b.disabled = false; });
    }

    // --- Liste ---
    function afficherListe() {
      $('vue-form').hidden = true;
      $('vue-liste').hidden = false;
      if (!donnees.rencontres.length) {
        $('liste').innerHTML = '<div class="vide">Aucune rencontre à venir.</div>';
        return;
      }
      var html = '', jour = '';
      donnees.rencontres.forEach(function (r) {
        if (r.date !== jour) { jour = r.date; html += '<div class="jour">' + esc(dateLongue(r.date)) + '</div>'; }
        var validee = r.statut === 'Validée';
        html += '<div class="rencontre">' +
          '<div class="titre">' + esc(r.equipe) + ' – ' + esc(r.adversaire || 'Adversaire à venir') + '</div>' +
          '<div class="details">' + esc(r.heure || 'Heure à venir') + ' · ' + esc(r.lieu || 'Lieu à venir') +
            ' · ' + r.nbReponses + ' réponse' + (r.nbReponses > 1 ? 's' : '') + '</div>' +
          '<div class="actions">' +
            '<span class="badge ' + (validee ? 'validee">✅ Validée' : 'attente">⏳ En attente') + '</span>' +
            '<button class="petit" data-modifier="' + esc(r.id) + '">Modifier</button>' +
            '<button class="petit" data-statut="' + esc(r.id) + '">' + (validee ? 'Remettre en attente' : 'Valider') + '</button>' +
          '</div></div>';
      });
      $('liste').innerHTML = html;
    }

    // --- Formulaire ---
    function afficherForm(r) {
      edition = r || null;
      $('titre-form').textContent = r ? 'Modifier la rencontre' : 'Nouvelle rencontre';
      options($('f-equipe'), donnees.equipes);
      options($('f-lieu'), donnees.lieux, 'Lieu à venir');
      options($('f-statut'), donnees.statuts);
      $('f-date').value = r ? r.date : '';
      $('f-heure').value = r ? r.heure : '';
      $('f-equipe').value = r ? r.equipe : donnees.equipes[0];
      $('f-adversaire').value = r ? r.adversaire : '';
      $('f-lieu').value = r ? r.lieu : '';
      $('f-statut').value = r ? r.statut : 'En attente';
      $('f-infos').value = r ? r.infos : '';
      $('supprimer').hidden = !r;
      $('aide-suppr').hidden = !(r && r.nbReponses);
      if (r && r.nbReponses) $('aide-suppr').textContent = 'Les ' + r.nbReponses + ' réponse(s) des joueurs seront aussi supprimées.';
      $('vue-liste').hidden = true;
      $('vue-form').hidden = false;
      $('f-date').focus();
    }

    function rencontre(id) {
      return donnees.rencontres.filter(function (r) { return r.id === id; })[0];
    }

    document.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.id === 'ajouter') afficherForm(null);
      else if (b.id === 'annuler') afficherListe();
      else if (b.hasAttribute('data-modifier')) afficherForm(rencontre(b.getAttribute('data-modifier')));
      else if (b.hasAttribute('data-statut')) {
        var r = Object.assign({}, rencontre(b.getAttribute('data-statut')));
        r.statut = r.statut === 'Validée' ? 'En attente' : 'Validée';
        appeler('enregistrerRencontre', [r], function () {
          afficherListe();
          message(r.statut === 'Validée' ? 'Date validée.' : 'Remise en attente.', 'ok');
        });
      } else if (b.id === 'supprimer' && edition) {
        if (!confirm('Supprimer ' + edition.equipe + ' – ' + (edition.adversaire || 'adversaire à venir') + ' du ' + dateLongue(edition.date) + ' ?')) return;
        appeler('supprimerRencontre', [edition.id], function () { afficherListe(); message('Rencontre supprimée.', 'ok'); });
      }
    });

    $('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var r = {
        id: edition ? edition.id : '',
        date: $('f-date').value,
        heure: $('f-heure').value,
        equipe: $('f-equipe').value,
        adversaire: $('f-adversaire').value,
        lieu: $('f-lieu').value,
        statut: $('f-statut').value,
        infos: $('f-infos').value,
      };
      if (!r.date) { message('Choisis une date.', 'erreur'); return; }
      appeler('enregistrerRencontre', [r], function () {
        afficherListe();
        message(edition ? 'Rencontre modifiée.' : 'Rencontre ajoutée.', 'ok');
      });
    });

    appeler('getDonneesCapitaines', [], afficherListe);
  </script>
</body>
</html>
