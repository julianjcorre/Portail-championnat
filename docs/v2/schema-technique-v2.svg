<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .t{fill:#0f172a;font-size:17px;font-weight:700}
      .s{fill:#334155;font-size:13px}
      .m{fill:#475569;font-size:12px;font-family:Consolas, Menlo, monospace}
      .l{fill:#0f172a;font-size:12.5px;font-weight:600}
      .lo{fill:#c2410c;font-size:12.5px;font-weight:600}
      .lg{fill:#7c3aed;font-size:12.5px;font-weight:600}
    </style>
  </defs>

  <rect width="1200" height="850" fill="#ffffff"/>
  <text x="30" y="42" font-size="24" font-weight="700" fill="#0f172a">Portail championnat V2 – fonctionnement technique</text>
  <text x="30" y="66" class="s">Ce qui tourne tous les jours (traits pleins), et ce qui ne sert qu'aux mises en ligne et à la bascule (pointillés).</text>

  <!-- Utilisateurs -->
  <rect x="30" y="120" width="200" height="210" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="50" y="150" class="t">Utilisateurs</text>
  <text x="50" y="178" class="s">Joueurs (sans compte)</text>
  <text x="50" y="200" class="s">Capitaines / admins</text>
  <text x="50" y="222" class="s">Communication</text>
  <text x="50" y="256" class="m">Téléphone ou ordinateur</text>
  <text x="50" y="274" class="m">Appli installée (PWA)</text>
  <text x="50" y="292" class="m">Nom mémorisé sur</text>
  <text x="50" y="308" class="m">le téléphone</text>

  <!-- Page -->
  <rect x="330" y="120" width="260" height="160" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="350" y="150" class="t">La page (GitHub Pages)</text>
  <text x="350" y="172" class="s">Même adresse qu'aujourd'hui :</text>
  <text x="350" y="192" class="m">tcbazogeais.github.io</text>
  <text x="350" y="220" class="m">index.html, sw.js,</text>
  <text x="350" y="238" class="m">manifest.webmanifest</text>
  <text x="350" y="264" class="s">Seul changement : URL_API</text>

  <!-- Zone Cloudflare -->
  <rect x="680" y="85" width="490" height="420" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="700" y="112" font-size="15" font-weight="700" fill="#c2410c">CLOUDFLARE (compte du club, gratuit)</text>

  <rect x="710" y="130" width="430" height="135" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text x="730" y="158" class="t">Le serveur : Cloudflare Worker</text>
  <text x="730" y="180" class="s">Remplace Code.gs. Mêmes fonctions, mêmes noms :</text>
  <text x="730" y="202" class="m">getDonnees, repondre, inscrire,</text>
  <text x="730" y="220" class="m">definirSelection, enregistrerResultat…</text>
  <text x="730" y="248" class="s">Vérifie les jetons et les rôles des capitaines.</text>

  <rect x="710" y="315" width="430" height="170" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text x="730" y="343" class="t">Les données : base Cloudflare D1</text>
  <text x="730" y="365" class="s">Remplace la Google Sheet. Une table par onglet :</text>
  <text x="730" y="387" class="m">rencontres, joueurs, reponses, selection,</text>
  <text x="730" y="405" class="m">resultats, poules</text>
  <text x="730" y="423" class="s">+ une table pour les accès capitaines</text>
  <text x="730" y="441" class="s">(jetons, codes brouillés, rôles).</text>
  <text x="730" y="467" class="s">Historique 30 jours : retour arrière possible.</text>

  <!-- Gmail -->
  <rect x="330" y="370" width="260" height="125" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="350" y="400" class="t">Gmail (compte du club)</text>
  <text x="350" y="422" class="s">Envoie le code de connexion</text>
  <text x="350" y="442" class="s">des capitaines, quand le</text>
  <text x="350" y="462" class="s">serveur le lui demande.</text>
  <text x="350" y="484" class="m">API Gmail</text>

  <!-- Flux du quotidien -->
  <line x1="230" y1="185" x2="326" y2="185" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="240" y="176" class="l">1. ouvre</text>
  <text x="240" y="205" class="l">le lien</text>

  <line x1="590" y1="185" x2="706" y2="185" stroke="#c2410c" stroke-width="3" marker-end="url(#fo)"/>
  <text x="598" y="176" class="lo">2. { fn, args }</text>
  <line x1="706" y1="225" x2="594" y2="225" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#fo)"/>
  <text x="598" y="246" class="lo">3. réponse</text>
  <text x="598" y="262" class="lo">≈ 0,2 s</text>

  <line x1="925" y1="265" x2="925" y2="311" stroke="#c2410c" stroke-width="2.5" marker-start="url(#fo)" marker-end="url(#fo)"/>
  <text x="935" y="294" class="lo">lit / écrit</text>

  <line x1="710" y1="258" x2="594" y2="398" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#fg)"/>

  <line x1="330" y1="430" x2="160" y2="334" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#fg)"/>
  <text x="205" y="400" class="lg">mail avec</text>
  <text x="205" y="416" class="lg">le code</text>

  <!-- Migration -->
  <rect x="30" y="610" width="250" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="50" y="640" class="t">Ancienne V1</text>
  <text x="50" y="662" class="s">Google Sheet + Apps Script</text>
  <text x="50" y="684" class="s">Menu « Exporter pour</text>
  <text x="50" y="702" class="s">Cloudflare » (lecture seule)</text>
  <text x="50" y="728" class="s">Gardée intacte 2 semaines :</text>
  <text x="50" y="746" class="s">roue de secours.</text>
  <path d="M155,610 V545 H650 V430 H706" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#f)"/>
  <text x="300" y="537" fill="#15803d" font-size="12.5" font-weight="600">copie des données (tests, puis le grand soir)</text>

  <!-- GitHub -->
  <rect x="330" y="610" width="360" height="150" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="350" y="640" class="t">GitHub (le poste de pilotage)</text>
  <text x="350" y="662" class="s">Dépôt TCBazogeais/… : tout le code</text>
  <text x="350" y="686" class="m">page/    → la page</text>
  <text x="350" y="704" class="m">worker/  → le serveur</text>
  <text x="350" y="722" class="m">schema.sql → les tables</text>
  <text x="350" y="746" class="s">+ ce dossier docs/v2</text>

  <rect x="770" y="610" width="400" height="150" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="790" y="640" class="t">GitHub Actions (automatique)</text>
  <text x="790" y="662" class="s">À chaque modification poussée :</text>
  <text x="790" y="684" class="s">• met le serveur à jour chez Cloudflare</text>
  <text x="790" y="704" class="s">• met la page à jour sur GitHub Pages</text>
  <text x="790" y="730" class="m">Secrets : clé Cloudflare,</text>
  <text x="790" y="748" class="m">accès Gmail (jamais dans le code)</text>

  <line x1="690" y1="685" x2="766" y2="685" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#f)"/>
  <text x="704" y="676" class="l">push</text>

  <line x1="1060" y1="610" x2="1060" y2="509" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#f)"/>
  <text x="1070" y="560" class="l">déploie</text>

  <path d="M830,610 V585 H615 V274 H594" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#f)"/>
  <text x="650" y="577" class="l">publie la page</text>

  <!-- Légende -->
  <line x1="30" y1="805" x2="80" y2="805" stroke="#334155" stroke-width="2.5"/>
  <text x="90" y="810" class="s">tous les jours</text>
  <line x1="210" y1="805" x2="260" y2="805" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="270" y="810" class="s">mises en ligne / bascule</text>
  <rect x="460" y="795" width="18" height="18" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="486" y="810" class="s">nouveau (Cloudflare)</text>
  <rect x="660" y="795" width="18" height="18" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="686" y="810" class="s">Google (mails seulement)</text>
  <rect x="880" y="795" width="18" height="18" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="906" y="810" class="s">ancienne V1 (secours)</text>
</svg>
