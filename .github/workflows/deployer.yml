# Met en ligne le code dans Apps Script à chaque push sur main.
# Seul secret nécessaire (Settings → Secrets and variables → Actions) :
#   CLASPRC_JSON   contenu de ~/.clasprc.json après `clasp login` (compte Google du club)
name: Déployer sur Apps Script

on:
  push:
    branches: [main]
    paths: [Code.gs, Index.html, appsscript.json, .github/workflows/deployer.yml]
  workflow_dispatch:

# Identifiants du projet Apps Script (pas secrets : l'ID de déploiement figure dans l'URL publique).
env:
  SCRIPT_ID: 1lIi5_dYHk-9ij1H6QhYfyYkGlE8aBEsTzdLZfdQ86XkmvJOQrmHeF_eF  # Paramètres du projet → ID du script
  DEPLOYMENT_ID: AKfycbw6zkDi717zVCuxSCE4YUY7KYUMTSJroeg_sjgdOOa3m1MFUf7jbcJBKdRbhFOrDKZd5g  # Gérer les déploiements → ID de déploiement (garde la même URL)

concurrency:
  group: deploiement-apps-script
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Même version que celle utilisée pour `clasp login` (format de .clasprc.json).
      - name: Installer clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Préparer les identifiants
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON manquant (voir README)."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json

      - name: Envoyer le code
        run: clasp push --force

      - name: Mettre à jour le déploiement
        run: |
          if [ "$DEPLOYMENT_ID" = "A_REMPLIR" ]; then
            echo "::warning::DEPLOYMENT_ID à remplir dans ce fichier : code envoyé mais page en ligne inchangée."
            exit 0
          fi
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
