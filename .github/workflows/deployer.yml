# Met en ligne le code dans Apps Script à chaque push sur main.
# Secrets nécessaires (Settings → Secrets and variables → Actions) :
#   CLASPRC_JSON   contenu de ~/.clasprc.json après `clasp login` (compte Google du club)
#   SCRIPT_ID      Apps Script → Paramètres du projet → ID du script
#   DEPLOYMENT_ID  Déployer → Gérer les déploiements → ID de déploiement (garde la même URL)
name: Déployer sur Apps Script

on:
  push:
    branches: [main]
    paths: [Code.gs, Index.html, appsscript.json, .github/workflows/deployer.yml]
  workflow_dispatch:

concurrency:
  group: deploiement-apps-script
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Même version que celle utilisée pour `clasp login` (format de .clasprc.json).
      - name: Installer clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Préparer les identifiants
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::Secrets CLASPRC_JSON et SCRIPT_ID manquants (voir README)."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json

      - name: Envoyer le code
        run: clasp push --force

      - name: Mettre à jour le déploiement
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::warning::Secret DEPLOYMENT_ID manquant : code envoyé mais page en ligne inchangée."
            exit 0
          fi
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
